<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header class="m-topo">
  <button type="button" class="m-topo-menu" onclick="smToggle()" aria-label="Abrir o menu"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
  <a class="m-marca" href="index.html"><img src="assets/logo-mariua.png" alt=""><b>Mariuá</b><span>Sistema de Obras</span></a>
  <div class="m-busca">
    <label for="m-busca-campo"><i class="ti ti-search" aria-hidden="true"></i>
      <input id="m-busca-campo" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar obra, equipe ou tela"
             role="combobox" aria-expanded="false" aria-controls="m-busca-res" aria-autocomplete="list">
      <span class="m-kbd">Ctrl K</span>
    </label>
    <div id="m-busca-res" class="m-busca-res" role="listbox" aria-label="Resultados da busca"></div>
  </div>
  <div class="m-topo-dir">
    <span class="m-sinc" id="m-sinc" data-estado="lendo"><i aria-hidden="true"></i><span>Carregando…</span></span>
    <button type="button" id="user-avatar" class="m-avatar" onclick="if(window.mariuaPerfil)window.mariuaPerfil()" aria-label="Minha conta">·</button>
  </div>
</header>

<aside class="sm-side">
  <!-- Menu montado por nav.js — NÃO edite os itens aqui, edite a lista em nav.js -->

</aside>
<script src="nav.js?v=5"></script>

<main class="m-pagina" id="conteudo">
  <div class="m-cab">
    <div>
      <h1>Painel do dia</h1>
      <p id="sub-data">O que fugiu do previsto hoje, cruzando turno, programação, RDO, obras e SESMT.</p>
    </div>
    <div class="m-acoes">
      <button type="button" class="m-bt" id="bt-atualizar"><i class="ti ti-refresh" aria-hidden="true"></i>Atualizar</button>
      <button type="button" class="m-bt" id="bt-copiar"><i class="ti ti-copy" aria-hidden="true"></i>Copiar resumo</button>
      <button type="button" class="m-bt" id="bt-imprimir"><i class="ti ti-printer" aria-hidden="true"></i>Imprimir</button>
    </div>
  </div>

  <div class="m-filtros" role="search">
    <label class="m-campo">Base
      <select class="m-select" id="f-base"><option value="">Todas</option></select>
    </label>
    <label class="m-campo">Supervisor
      <select class="m-select" id="f-sup"><option value="">Todos</option></select>
    </label>
    <label class="m-procura"><i class="ti ti-search" aria-hidden="true"></i>
      <input type="search" id="f-q" placeholder="Filtrar por equipe, obra ou encarregado" aria-label="Filtrar pendências">
    </label>
    <span class="m-meta" id="f-contrato"></span>
  </div>

  <section class="m-cartao m-faixa" id="resumo" aria-label="Resumo do dia">
    <div class="m-stat"><div class="m-esq" style="width:60%"></div><div class="m-esq" style="height:30px;width:80%"></div></div>
    <div class="m-stat"><div class="m-esq" style="width:60%"></div><div class="m-esq" style="height:30px;width:80%"></div></div>
    <div class="m-stat"><div class="m-esq" style="width:60%"></div><div class="m-esq" style="height:30px;width:80%"></div></div>
    <div class="m-stat"><div class="m-esq" style="width:60%"></div><div class="m-esq" style="height:30px;width:80%"></div></div>
    <div class="m-stat"><div class="m-esq" style="width:60%"></div><div class="m-esq" style="height:30px;width:80%"></div></div>
  </section>

  <section class="m-cartao" aria-labelledby="t-pend">
      <h2 class="m-oculto" id="t-pend">Pendências</h2>
      <div class="m-abas" role="tablist" aria-label="Filtrar por assunto" id="abas"></div>
      <div id="lista" role="tabpanel" aria-live="polite">
        <div class="m-cartao-corpo" style="display:flex;flex-direction:column;gap:14px">
          <div class="m-esq"></div><div class="m-esq" style="width:85%"></div><div class="m-esq" style="width:70%"></div>
        </div>
      </div>
  </section>

  <div class="m-grade">
      <section class="m-cartao" aria-labelledby="t-bases">
        <div class="m-cartao-cab"><h2 class="m-h2" id="t-bases">Turno por base</h2></div>
        <div class="m-cartao-corpo" id="por-base"><div class="m-esq"></div></div>
      </section>
      <section class="m-cartao" aria-labelledby="t-fontes">
        <div class="m-cartao-cab"><h2 class="m-h2" id="t-fontes">De onde vêm os dados</h2></div>
        <div class="m-cartao-corpo" id="fontes"><div class="m-esq"></div></div>
      </section>
  </div>
  <p class="m-meta" id="atualizado"></p>
</main>

<script src="identidade.js?v=3"></script>
<script src="mariua-ui.js?v=1"></script>
<script src="mariua-painel.js?v=1"></script>
<script>
(function () {
  'use strict';
  var P = window.MariuaPainel, UI = window.MariuaUI, util = P.util;
  var esc = UI.esc;
  var estado = { cat: 'todas', base: '', sup: '', q: '', todas: false };
  try { var salvo = JSON.parse(sessionStorage.getItem('mariua_painel_filtros') || '{}'); ['cat', 'base', 'sup'].forEach(function (k) { if (salvo[k] != null) estado[k] = salvo[k]; }); } catch (e) {}
  var estadosUsuario = null, analise = null, ultimaLeitura = 0;
  var LIMITE_LINHAS = 60;
  var CATS = [['todas', 'Todas'], ['turno', 'Turno'], ['prog', 'Programação'], ['rdo', 'RDO'], ['obras', 'Obras'], ['sesmt', 'SESMT'], ['dados', 'Importações']];
  var NIVEL = { critico: ['Crítico', 'alert-octagon'], atencao: ['Atenção', 'alert-triangle'], aviso: ['Aviso', 'info-circle'] };
  var UF = { ba: 'BA', mg: 'MG', se: 'SE' };
  function $(id) { return document.getElementById(id); }
  function guardar() { try { sessionStorage.setItem('mariua_painel_filtros', JSON.stringify({ cat: estado.cat, base: estado.base, sup: estado.sup })); } catch (e) {} }

  $('sub-data').textContent = UI.dataLonga(new Date()) + '. O que fugiu do previsto, cruzando turno, programação, RDO, obras e SESMT.';

  // ── leitura ─────────────────────────────────────────────────────────
  function atualizar(manual) {
    UI.sinc('lendo', 'Atualizando…');
    $('bt-atualizar').disabled = true;
    return P.carregar().then(function (bruto) {
      ultimaLeitura = Date.now();
      estadosUsuario = P.estadosDoUsuario(bruto, window.MARIUA_USER);
      desenhar();
      UI.sinc('ok', 'Atualizado às ' + UI.hora(bruto.em));
      if (manual) UI.toast('Painel atualizado');
    }).catch(function (err) {
      console.error('[painel]', err);
      UI.sinc('erro', 'Sem conexão com o banco');
      if (!analise) {
        $('lista').innerHTML = '<div class="m-erro"><i class="ti ti-plug-connected-x" aria-hidden="true"></i>' +
          '<span>Não foi possível ler o banco: ' + esc(err.message) + '</span>' +
          '<button type="button" class="m-bt m-bt-peq" onclick="window.painelAtualizar(true)">Tentar de novo</button></div>';
        $('resumo').innerHTML = '<div class="m-stat"><span class="m-stat-erro">Sem dados enquanto o banco não responder.</span></div>';
      } else {
        UI.toast('Não foi possível atualizar. Mostrando a última leitura.');
      }
    }).then(function () { $('bt-atualizar').disabled = false; });
  }
  window.painelAtualizar = atualizar;

  function desenhar() {
    analise = P.analisar(P.bruto, { estados: estadosUsuario, base: estado.base, supervisor: estado.sup });
    desenharFiltros();
    desenharResumo();
    desenharAbasELista();
    desenharPorBase();
    desenharFontes();
    $('atualizado').textContent = 'Leitura às ' + UI.hora(analise.em) + '. A tela atualiza sozinha a cada 5 minutos.';
  }

  // ── filtros ─────────────────────────────────────────────────────────
  function opcoes(sel, lista, atual, todos) {
    var h = '<option value="">' + todos + '</option>';
    var achou = !atual;
    lista.forEach(function (o) { if (o.v === atual) achou = true; h += '<option value="' + esc(o.v) + '"' + (o.v === atual ? ' selected' : '') + '>' + esc(o.t) + '</option>'; });
    if (!achou) h += '<option value="' + esc(atual) + '" selected>' + esc(atual) + '</option>';
    sel.innerHTML = h;
  }
  function desenharFiltros() {
    opcoes($('f-base'), analise.opcoes.bases.map(function (b) { return { v: b.id, t: b.nome }; }), estado.base, estadosUsuario ? 'Todas as liberadas' : 'Todas');
    opcoes($('f-sup'), analise.opcoes.supervisores.map(function (s) { return { v: s, t: s }; }), estado.sup, 'Todos');
    $('f-contrato').textContent = estadosUsuario ? 'Seu acesso: ' + estadosUsuario.map(function (u) { return UF[u] || u; }).join(', ') : '';
  }
  $('f-base').addEventListener('change', function () { estado.base = this.value; estado.todas = false; guardar(); desenhar(); });
  $('f-sup').addEventListener('change', function () { estado.sup = this.value; estado.todas = false; guardar(); desenhar(); });
  $('f-q').addEventListener('input', function () { estado.q = this.value; estado.todas = false; desenharAbasELista(); });

  // ── números do dia ──────────────────────────────────────────────────
  function stat(href, rot, valor, extra, barra, erro) {
    var tag = href && UI.pode(href) ? 'a' : 'div';
    return '<' + tag + ' class="m-stat"' + (tag === 'a' ? ' href="' + href + '"' : '') + '>' +
      '<span class="m-stat-rot">' + rot + '</span>' +
      '<span class="m-stat-val">' + valor + '</span>' + (barra || '') +
      (extra ? '<span class="' + (erro ? 'm-stat-erro' : 'm-stat-ext') + '">' + extra + '</span>' : '') +
      '</' + tag + '>';
  }
  function desenharResumo() {
    var r = analise.resumo, h = '';
    var t = r.turno;
    if (!t) h += stat('turno.html', 'Turno', '—', 'Nenhum turno salvo no banco.', '', true);
    else if (!t.hoje) h += stat('turno.html', 'Turno', '—', 'O turno de hoje não foi importado. Último: ' + esc(t.data) + '.', '', true);
    else {
      var tot = t.ok + t.justif + t.falta;
      var barra = tot ? '<div class="m-barra" role="img" aria-label="' + t.ok + ' abriram, ' + t.justif + ' justificadas, ' + t.falta + ' sem abrir">' +
        '<span style="flex:' + t.ok + ';background:var(--m-ok-forte)"></span><span style="flex:' + t.justif + ';background:var(--m-atencao-forte)"></span>' +
        '<span style="flex:' + t.falta + ';background:var(--m-critico-forte)"></span></div>' : '';
      h += stat('turno.html', 'Turno', t.ok + ' <small>de ' + tot + ' abriram</small>', t.justif + ' justificadas, ' + t.falta + ' sem abrir', barra);
    }
    var d = r.rdo;
    if (!d) h += stat('rdo.html', 'RDO', '—', 'Nenhum RDO no banco.', '', true);
    else if (!d.valido) h += stat('rdo.html', 'RDO', '—', d.data ? 'Sem importar desde ' + util.br(d.data) + '.' : 'Ainda não importado.', '', true);
    else h += stat('rdo.html', 'RDO de ' + util.br(d.data), d.lancou + ' <small>lançados</small>', d.nao ? d.nao + ' equipes sem RDO' : 'Todas as equipes lançaram');
    var p = r.progHoje;
    h += stat('prog.html', 'Programação de hoje', p.frentes + ' <small>' + (p.frentes === 1 ? 'frente' : 'frentes') + '</small>',
      p.frentes ? UI.moeda(p.previsto, true) + ' previstos pelo fator K' + (p.semLigacao ? '. ' + p.semLigacao + ' sem equipe ligada' : '') : 'Nada lançado para hoje');
    var e = r.execucao;
    if (e && e.pct != null) h += stat('prog.html', 'Execução de ' + util.br(e.data), Math.round(e.pct * 100) + '%', UI.moeda(e.realizado, true) + ' de ' + UI.moeda(e.previsto, true));
    else h += stat('prog.html', 'Execução', '—', 'Sem programação nos últimos 7 dias.');
    h += stat('estagios.html', 'Obras paradas', String(r.obrasParadas), r.obrasParadas ? 'em execução, sem produção há ' + P.REGRAS.diasObraParada + ' dias ou mais' : 'Nenhuma obra parada');
    $('resumo').innerHTML = h;
  }

  // ── abas e lista ────────────────────────────────────────────────────
  function filtrarBusca(itens) {
    var q = util.norm(estado.q);
    if (!q) return itens;
    return itens.filter(function (i) {
      return util.norm([i.titulo, i.detalhe, i.alvo, i.resp, i.base ? i.base.nome : ''].join(' ')).indexOf(q) >= 0;
    });
  }
  function desenharAbasELista() {
    var itens = filtrarBusca(analise.itens);
    var cont = { todas: itens.length };
    itens.forEach(function (i) { cont[i.cat] = (cont[i.cat] || 0) + 1; });
    if (estado.cat !== 'todas' && !cont[estado.cat]) estado.cat = 'todas';
    $('abas').innerHTML = CATS.filter(function (c) { return c[0] === 'todas' || cont[c[0]]; }).map(function (c) {
      var on = c[0] === estado.cat;
      return '<button type="button" class="m-aba" role="tab" data-cat="' + c[0] + '" aria-selected="' + on + '" aria-controls="lista">' +
             esc(c[1]) + '<span class="m-num">' + (cont[c[0]] || 0) + '</span></button>';
    }).join('');
    var lista = estado.cat === 'todas' ? itens : itens.filter(function (i) { return i.cat === estado.cat; });
    if (!lista.length) {
      var temFiltro = estado.q || estado.base || estado.sup;
      $('lista').innerHTML = '<div class="m-vazio"><i class="ti ti-circle-check" aria-hidden="true"></i><span>' +
        (temFiltro ? 'Nada fora do previsto com estes filtros.' : 'Nada fora do previsto agora.') + '</span></div>';
      return;
    }
    var mostrar = estado.todas ? lista : lista.slice(0, LIMITE_LINHAS);
    var h = '<div class="m-tabela-caixa"><table class="m-tabela" style="min-width:900px"><thead><tr>' +
      '<th scope="col" style="width:112px">Nível</th><th scope="col">O que aconteceu</th><th scope="col" style="width:170px">Equipe ou obra</th>' +
      '<th scope="col" style="width:120px">Base</th><th scope="col" style="width:160px">Responsável</th><th scope="col" style="width:80px">Desde</th>' +
      '<th scope="col" style="width:170px"><span class="m-oculto">Ação</span></th>' +
      '</tr></thead><tbody>';
    mostrar.forEach(function (i) {
      var n = NIVEL[i.nivel];
      var acao = '';
      if (i.acao) {
        acao = UI.pode(i.acao.href)
          ? '<a class="m-bt m-bt-peq" href="' + esc(i.acao.href) + '">' + esc(i.acao.texto) + '</a>'
          : '<span class="m-meta">Sem acesso à tela</span>';
      }
      h += '<tr><td><span class="m-selo ' + i.nivel + '"><i class="ti ti-' + n[1] + '" aria-hidden="true"></i>' + n[0] + '</span></td>' +
        '<td><div class="m-tit">' + esc(i.titulo) + '</div><div class="m-sub">' + esc(i.detalhe) + '</div></td>' +
        '<td class="m-cod" style="white-space:normal;word-break:break-word">' + esc(i.alvo) + '</td>' +
        '<td>' + esc(i.base ? i.base.nome : '—') + '</td>' +
        '<td>' + esc(i.resp || '—') + '</td>' +
        '<td style="white-space:nowrap">' + esc(i.desde || '—') + '</td>' +
        '<td style="text-align:right">' + acao + '</td></tr>';
    });
    h += '</tbody></table></div>';
    if (mostrar.length < lista.length) {
      h += '<div class="m-cartao-corpo"><button type="button" class="m-bt m-bt-peq" id="bt-todas">Mostrar todas as ' + lista.length + '</button></div>';
    }
    $('lista').innerHTML = h;
    var bt = $('bt-todas');
    if (bt) bt.addEventListener('click', function () { estado.todas = true; desenharAbasELista(); });
    UI.desativarTelasAusentes($('lista'));
  }
  $('abas').addEventListener('click', function (e) {
    var b = e.target.closest('.m-aba');
    if (!b) return;
    estado.cat = b.getAttribute('data-cat'); estado.todas = false; guardar(); desenharAbasELista();
  });
  $('abas').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var abas = Array.prototype.slice.call(this.querySelectorAll('.m-aba'));
    var i = abas.indexOf(document.activeElement);
    if (i < 0) return;
    var prox = abas[(i + (e.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length];
    prox.focus(); prox.click();
    var nova = this.querySelector('[data-cat="' + prox.getAttribute('data-cat') + '"]');
    if (nova) nova.focus();
  });
  // ── turno por base ──────────────────────────────────────────────────
  function desenharPorBase() {
    var t = analise.resumo.turno, linhas = analise.resumo.porBase;
    if (!t || !t.hoje) { $('por-base').innerHTML = '<p class="m-meta" style="margin:0">Aparece quando o turno de hoje for importado.</p>'; return; }
    if (!linhas.length) { $('por-base').innerHTML = '<p class="m-meta" style="margin:0">Nenhuma equipe com estes filtros.</p>'; return; }
    $('por-base').innerHTML = linhas.map(function (l) {
      return '<div style="display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid var(--m-linha2)">' +
        '<div style="display:flex;justify-content:space-between;gap:8px"><span class="m-tit">' + esc(l.base ? l.base.nome : 'Sem base definida') + '</span>' +
        '<span class="m-num" style="font-size:17px">' + l.ok + ' <span class="m-meta">de ' + l.total + '</span></span></div>' +
        '<div class="m-barra" role="img" aria-label="' + l.ok + ' abriram, ' + l.justif + ' justificadas, ' + l.falta + ' sem abrir">' +
        '<span style="flex:' + l.ok + ';background:var(--m-ok-forte)"></span><span style="flex:' + l.justif + ';background:var(--m-atencao-forte)"></span>' +
        '<span style="flex:' + l.falta + ';background:var(--m-critico-forte)"></span></div>' +
        (l.falta ? '<span class="m-meta">' + l.falta + ' sem abrir' + (l.justif ? ', ' + l.justif + ' justificadas' : '') + '</span>' : '') +
        '</div>';
    }).join('') + '<p class="m-meta" style="margin:10px 0 0">Verde: abriu. Laranja: justificada. Vermelho: sem abrir.</p>';
  }

  // ── fontes de dados ─────────────────────────────────────────────────
  function desenharFontes() {
    var r = analise.resumo, hoje = new Date();
    var h = analise.fontes.map(function (f) {
      var estadoF = 'ok', texto = f.atualizado ? UI.relativo(f.atualizado) : 'sem data';
      if (!f.existe) { estadoF = 'ausente'; texto = 'não encontrada'; }
      else if (f.chave === 'turno' && r.turno && !r.turno.hoje) { estadoF = 'velha'; texto = 'último turno ' + r.turno.data; }
      else if (f.chave === 'rdo_atual' && r.rdo && !r.rdo.valido) { estadoF = 'velha'; texto = r.rdo.data ? 'RDO de ' + util.br(r.rdo.data) : 'sem RDO'; }
      else if (f.chave === 'obras_base' && f.atualizado && util.diasEntre(f.atualizado, hoje) >= P.REGRAS.diasCarteiraVelha) estadoF = 'velha';
      var cor = { ok: 'var(--m-ok)', velha: 'var(--m-atencao)', ausente: 'var(--m-tinta2)' }[estadoF];
      var nome = UI.pode(f.tela) && f.existe ? '<a class="m-link" href="' + esc(f.tela) + '">' + esc(f.nome) + '</a>' : esc(f.nome);
      return '<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--m-linha2)">' +
        '<span>' + nome + '</span><span style="color:' + cor + ';white-space:nowrap;font-weight:600">' + esc(texto) + '</span></div>';
    }).join('');
    h += analise.viaAnonima
      ? '<div class="m-alerta atencao" style="margin-top:12px"><i class="ti ti-lock-open" aria-hidden="true"></i><span>A leitura só funcionou com a chave pública. Peça ao administrador para liberar a leitura com login no banco (RLS).</span></div>'
      : '<p class="m-meta" style="margin:10px 0 0">Lido com o seu login.</p>';
    $('fontes').innerHTML = h;
    UI.desativarTelasAusentes($('fontes'));
  }

  // ── ações do topo ───────────────────────────────────────────────────
  $('bt-atualizar').addEventListener('click', function () { atualizar(true); });
  $('bt-imprimir').addEventListener('click', function () { window.print(); });
  $('bt-copiar').addEventListener('click', function () {
    if (!analise) return;
    var rot = [];
    if (estado.base) { var b = analise.opcoes.bases.filter(function (x) { return x.id === estado.base; })[0]; if (b) rot.push(b.nome); }
    if (estado.sup) rot.push(estado.sup);
    UI.copiar(P.resumoTexto(analise, rot.join(', '))).then(function () { UI.toast('Resumo copiado. Cole no WhatsApp.'); },
      function () { UI.toast('Não foi possível copiar neste navegador.'); });
  });

  // ── início ──────────────────────────────────────────────────────────
  UI.esperarLogin().then(function () {
    atualizar(false);
    setInterval(function () { if (!document.hidden) atualizar(false); }, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && Date.now() - ultimaLeitura > 5 * 60 * 1000) atualizar(false);
    });
  });
})();
</script>
</body>
</html>
