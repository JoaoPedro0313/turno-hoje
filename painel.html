    <div class="m-stat"><div class="m-esq" style="width:60%"></div><div class="m-esq" style="height:24px;width:80%"></div></div>
  </section>

  <section class="m-cartao" aria-labelledby="t-pend">
    <div class="m-cartao-cab">
      <h2 class="m-h2" id="t-pend"><i class="ti ti-alert-triangle" aria-hidden="true"></i>Pendências</h2>
      <div class="m-abas" role="tablist" aria-label="Filtrar por assunto" id="abas"></div>
    </div>
    <div id="lista" role="tabpanel" aria-live="polite">
      <div class="m-cartao-corpo" style="display:flex;flex-direction:column;gap:12px">
        <div class="m-esq"></div><div class="m-esq" style="width:85%"></div><div class="m-esq" style="width:70%"></div>
      </div>
    </div>
  </section>

  <div class="m-grade">
    <section class="m-cartao" aria-labelledby="t-bases">
      <div class="m-cartao-cab"><h2 class="m-h2" id="t-bases"><i class="ti ti-map-pin" aria-hidden="true"></i>Turno por base</h2></div>
      <div class="m-cartao-corpo" id="por-base"><div class="m-esq"></div></div>
    </section>
    <section class="m-cartao" aria-labelledby="t-fontes">
      <div class="m-cartao-cab"><h2 class="m-h2" id="t-fontes"><i class="ti ti-database" aria-hidden="true"></i>De onde vêm os dados</h2></div>
      <div class="m-cartao-corpo" id="fontes"><div class="m-esq"></div></div>
    </section>
  </div>
  <p class="m-meta" id="atualizado"></p>
</main>

<script src="identidade.js?v=3"></script>
<script src="mariua-ui.js?v=2"></script>
<script src="mariua-painel.js?v=2"></script>
<script>
/* Confere se os arquivos desta tela chegaram junto com esta página.
   Se faltar algum, mostra qual é em vez de abrir a tela quebrada. */
(function () {
  var falta = [];
  try { var tb = document.querySelector('.top-bar'); if (tb && getComputedStyle(tb).position !== 'fixed') falta.push('mariua-ui.css'); } catch (e) {}
  if (!window.MariuaUI) falta.push('mariua-ui.js');
  if (!window.MariuaPainel) falta.push('mariua-painel.js');
  try {
    var nav = window.mariuaNav && window.mariuaNav.itens, temPainel = false;
    if (nav) nav.grupos.forEach(function (g) { g.itens.forEach(function (i) { if (/painel\.html$/i.test(i.href)) temPainel = true; }); });
    if (nav && !temPainel) falta.push('nav.js (a versão nova, com o Painel do dia)');
  } catch (e) {}
  if (!falta.length) return;
  window.__MARIUA_FALTA = falta;
  console.error('[mariua] Arquivos faltando ou antigos nesta pasta:', falta.join(', '));
  if (falta.indexOf('mariua-ui.js') < 0 && falta.indexOf('mariua-ui.css') < 0 && falta.indexOf('mariua-painel.js') < 0) return;
  var caixa = document.createElement('div');
  caixa.setAttribute('role', 'alert');
  caixa.style.cssText = 'font-family:Barlow,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:22px 24px;border:2px solid #F3C3B4;border-radius:12px;background:#FFF4F1;color:#5C1610;line-height:1.5';
  caixa.innerHTML = '<div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">Faltam arquivos desta tela no site</div>' +
    '<div style="font-size:.95rem">Copie para a <b>mesma pasta</b> deste arquivo, sem subpasta:</div>' +
    '<ul style="margin:10px 0 12px;padding-left:20px;font-size:.95rem">' + falta.map(function (f) { return '<li><code>' + f + '</code></li>'; }).join('') + '</ul>' +
    '<div style="font-size:.9rem">Depois do envio, espere o site atualizar (cerca de 1 minuto no GitHub Pages) e recarregue com <b>Ctrl+F5</b>.</div>';
  var main = document.querySelector('main');
  if (main) main.innerHTML = '';
  document.body.insertBefore(caixa, document.body.firstChild);   /* primeira coisa da tela, mesmo sem o CSS */
})();
</script>
<script>
(function () {
  'use strict';
  if (window.__MARIUA_FALTA && (!window.MariuaPainel || !window.MariuaUI)) return;
  var P = window.MariuaPainel, UI = window.MariuaUI, util = P.util;
  var esc = UI.esc;
  var estado = { cat: 'todas', base: '', sup: '', q: '', todas: false };
  try { var salvo = JSON.parse(sessionStorage.getItem('mariua_painel_filtros') || '{}'); ['cat', 'base', 'sup'].forEach(function (k) { if (salvo[k] != null) estado[k] = salvo[k]; }); } catch (e) {}
  var estadosUsuario = null, analise = null, ultimaLeitura = 0;
  var LIMITE_LINHAS = 60;
  var CATS = [['todas', 'Todas'], ['turno', 'Turno'], ['prog', 'Programação'], ['rdo', 'RDO'], ['obras', 'Obras'], ['sesmt', 'SESMT'], ['dados', 'Importações']];
  var NIVEL = { critico: ['Crítico', 'alert-octagon'], atencao: ['Atenção', 'alert-triangle'], aviso: ['Aviso', 'info-circle'] };
  var COR = { ok: '#0d7377', justif: '#f0a500', falta: '#e53e3e' };
  var UF = { ba: 'BA', mg: 'MG', se: 'SE' };
  function $(id) { return document.getElementById(id); }
  function guardar() { try { sessionStorage.setItem('mariua_painel_filtros', JSON.stringify({ cat: estado.cat, base: estado.base, sup: estado.sup })); } catch (e) {} }
  function barra(ok, justif, falta) {
    return '<div class="m-barra" role="img" aria-label="' + ok + ' abriram, ' + justif + ' justificadas, ' + falta + ' sem abrir">' +
      '<span style="flex:' + ok + ';background:' + COR.ok + '"></span><span style="flex:' + justif + ';background:' + COR.justif + '"></span>' +
      '<span style="flex:' + falta + ';background:' + COR.falta + '"></span></div>';
  }

  $('sub-data').textContent = UI.dataLonga(new Date()) + '. O que fugiu do previsto, cruzando turno, programação, RDO, obras e SESMT.';

  // ── leitura ─────────────────────────────────────────────────────────
  function atualizar(manual) {
    UI.sinc('lendo', 'Atualizando…');
    $('bt-atualizar').disabled = true;
    return P.carregar().then(function (bruto) {
      ultimaLeitura = Date.now();
      estadosUsuario = P.estadosDoUsuario(bruto, window.MARIUA_USER);
      desenhar();
      UI.sinc('ok', 'Banco online · ' + UI.hora(bruto.em));
      if (manual) UI.toast('Painel atualizado');
    }).catch(function (err) {
      console.error('[painel]', err);
      UI.sinc('erro', 'Sem conexão');
      if (!analise) {
        $('lista').innerHTML = '<div class="m-erro"><i class="ti ti-plug-connected-x" aria-hidden="true"></i>' +
          '<span>Não foi possível ler o banco: ' + esc(err.message) + '</span>' +
          '<button type="button" class="m-bt m-bt-peq" onclick="window.painelAtualizar(true)">Tentar de novo</button></div>';
        $('resumo').innerHTML = '<div class="m-stat"><span class="m-stat-erro">Sem dados enquanto o banco não responder.</span></div>';
      } else {
        UI.toast('Não foi possível atualizar. Mostrando a última leitura.');
      }
    }).then(function () { $('bt-atualizar').disabled = false; });
  }
  window.painelAtualizar = atualizar;

  function desenhar() {
    analise = P.analisar(P.bruto, { estados: estadosUsuario, base: estado.base, supervisor: estado.sup });
    desenharFiltros();
    desenharResumo();
    desenharAbasELista();
    desenharPorBase();
    desenharFontes();
    $('atualizado').textContent = 'Leitura às ' + UI.hora(analise.em) + '. A tela atualiza sozinha a cada 5 minutos.';
  }

  // ── filtros ─────────────────────────────────────────────────────────
  function opcoes(sel, lista, atual, todos) {
    var h = '<option value="">' + todos + '</option>', achou = !atual;
    lista.forEach(function (o) { if (o.v === atual) achou = true; h += '<option value="' + esc(o.v) + '"' + (o.v === atual ? ' selected' : '') + '>' + esc(o.t) + '</option>'; });
    if (!achou) h += '<option value="' + esc(atual) + '" selected>' + esc(atual) + '</option>';
    sel.innerHTML = h;
  }
  function desenharFiltros() {
    opcoes($('f-base'), analise.opcoes.bases.map(function (b) { return { v: b.id, t: b.nome }; }), estado.base, estadosUsuario ? 'Todas as liberadas' : 'Todas');
    opcoes($('f-sup'), analise.opcoes.supervisores.map(function (s) { return { v: s, t: s }; }), estado.sup, 'Todos');
    $('f-contrato').textContent = estadosUsuario ? 'Seu acesso: ' + estadosUsuario.map(function (u) { return UF[u] || u; }).join(', ') : '';
  }
  $('f-base').addEventListener('change', function () { estado.base = this.value; estado.todas = false; guardar(); desenhar(); });
  $('f-sup').addEventListener('change', function () { estado.sup = this.value; estado.todas = false; guardar(); desenhar(); });
  $('f-q').addEventListener('input', function () { estado.q = this.value; estado.todas = false; desenharAbasELista(); });

  // ── números do dia ──────────────────────────────────────────────────
  function stat(href, rot, valor, extra, extraBarra, erro) {
    var tag = href && UI.pode(href) ? 'a' : 'div';
    return '<' + tag + ' class="m-stat"' + (tag === 'a' ? ' href="' + href + '"' : '') + '>' +
      '<span class="m-stat-rot">' + rot + '</span><span class="m-stat-val">' + valor + '</span>' + (extraBarra || '') +
      (extra ? '<span class="' + (erro === 'aviso' ? 'm-stat-aviso' : erro ? 'm-stat-erro' : 'm-stat-ext') + '">' + extra + '</span>' : '') + '</' + tag + '>';
  }
  function desenharResumo() {
    var r = analise.resumo, h = '', t = r.turno;
    var tot = t ? t.ok + t.justif + t.falta : 0;
    if (!t || !tot) h += stat('turno.html', 'Turno', '—', 'Nenhum turno salvo no banco.', '', true);
    else if (t.hoje) h += stat('turno.html', 'Turno', t.ok + ' <small>de ' + tot + ' abriram</small>', t.justif + ' justificadas, ' + t.falta + ' sem abrir', barra(t.ok, t.justif, t.falta));
    else h += stat('turno.html', 'Turno de ' + util.br(util.dataDe(t.data)), t.ok + ' <small>de ' + tot + ' abriram</small>', 'O de hoje ainda não foi importado.', barra(t.ok, t.justif, t.falta), 'aviso');
    var d = r.rdo;
    if (!d || !d.lancou) h += stat('rdo.html', 'RDO', '—', d && d.data ? 'Sem RDO desde ' + util.br(d.data) + '.' : 'Nenhum RDO no banco.', '', true);
    else if (d.valido) h += stat('rdo.html', 'RDO de ' + util.br(d.data), d.lancou + ' <small>lançados</small>', d.nao ? d.nao + ' equipes sem RDO' : 'Todas as equipes lançaram');
    else h += stat('rdo.html', 'RDO de ' + util.br(d.data), d.lancou + ' <small>lançados</small>', 'Sem importar desde então.', '', 'aviso');
    var p = r.progHoje;
    h += stat('prog.html', 'Programação de hoje', p.frentes + ' <small>' + (p.frentes === 1 ? 'frente' : 'frentes') + '</small>',
      p.frentes ? UI.moeda(p.previsto, true) + ' previstos pelo fator K' + (p.semLigacao ? '. ' + p.semLigacao + ' sem equipe ligada' : '') : 'Nada lançado para hoje');
    var e = r.execucao;
    if (!e || e.pct == null) h += stat('prog.html', 'Execução', '—', 'Nenhuma programação no banco.');
    else if (e.recente) h += stat('prog.html', 'Execução de ' + util.br(e.data), Math.round(e.pct * 100) + '%', UI.moeda(e.realizado, true) + ' de ' + UI.moeda(e.previsto, true));
    else h += stat('prog.html', 'Execução de ' + util.br(e.data), Math.round(e.pct * 100) + '%', 'Sem programação depois desse dia.', '', 'aviso');
    h += stat('estagios.html', 'Obras paradas', String(r.obrasParadas), r.obrasParadas ? 'sem produção há ' + P.REGRAS.diasObraParada + ' dias ou mais' : 'Nenhuma obra parada');
    $('resumo').innerHTML = h;
  }

  // ── abas e lista ────────────────────────────────────────────────────
  function filtrarBusca(itens) {
    var q = util.norm(estado.q);
    if (!q) return itens;
    return itens.filter(function (i) { return util.norm([i.titulo, i.detalhe, i.alvo, i.resp, i.base ? i.base.nome : ''].join(' ')).indexOf(q) >= 0; });
  }
  function desenharAbasELista() {
    var itens = filtrarBusca(analise.itens), cont = { todas: itens.length };
    itens.forEach(function (i) { cont[i.cat] = (cont[i.cat] || 0) + 1; });
    if (estado.cat !== 'todas' && !cont[estado.cat]) estado.cat = 'todas';
    $('abas').innerHTML = CATS.filter(function (c) { return c[0] === 'todas' || cont[c[0]]; }).map(function (c) {
      return '<button type="button" class="m-aba" role="tab" data-cat="' + c[0] + '" aria-selected="' + (c[0] === estado.cat) + '" aria-controls="lista">' +
             esc(c[1]) + '<span class="m-num">(' + (cont[c[0]] || 0) + ')</span></button>';
    }).join('');
    var lista = estado.cat === 'todas' ? itens : itens.filter(function (i) { return i.cat === estado.cat; });
    if (!lista.length) {
      $('lista').innerHTML = '<div class="m-vazio"><i class="ti ti-circle-check" aria-hidden="true"></i><span>' +
        ((estado.q || estado.base || estado.sup) ? 'Nada fora do previsto com estes filtros.' : 'Nada fora do previsto agora.') + '</span></div>';
      return;
    }
    var mostrar = estado.todas ? lista : lista.slice(0, LIMITE_LINHAS);
    var h = '<div class="m-tabela-caixa"><table class="m-tabela" style="min-width:900px"><thead><tr>' +
      '<th scope="col" style="width:110px">Nível</th><th scope="col">O que aconteceu</th><th scope="col" style="width:160px">Equipe ou obra</th>' +
      '<th scope="col" style="width:110px">Base</th><th scope="col" style="width:150px">Responsável</th><th scope="col" style="width:70px">Desde</th>' +
      '<th scope="col" style="width:160px"><span class="m-oculto">Ação</span></th></tr></thead><tbody>';
    mostrar.forEach(function (i) {
      var n = NIVEL[i.nivel], acao = '';
      if (i.acao) acao = UI.pode(i.acao.href) ? '<a class="m-bt m-bt-peq" href="' + esc(i.acao.href) + '">' + esc(i.acao.texto) + '</a>' : '<span class="m-meta">Sem acesso à tela</span>';
      h += '<tr><td><span class="m-selo ' + i.nivel + '"><i class="ti ti-' + n[1] + '" aria-hidden="true"></i>' + n[0] + '</span></td>' +
        '<td><div class="m-tit">' + esc(i.titulo) + '</div><div class="m-sub">' + esc(i.detalhe) + '</div></td>' +
        '<td class="m-cod" style="white-space:normal;word-break:break-word">' + esc(i.alvo) + '</td>' +
        '<td>' + esc(i.base ? i.base.nome : '—') + '</td><td>' + esc(i.resp || '—') + '</td>' +
        '<td style="white-space:nowrap">' + esc(i.desde || '—') + '</td><td style="text-align:right">' + acao + '</td></tr>';
    });
    h += '</tbody></table></div>';
    if (mostrar.length < lista.length) h += '<div class="m-cartao-corpo"><button type="button" class="m-bt m-bt-peq" id="bt-todas">Mostrar todas as ' + lista.length + '</button></div>';
    $('lista').innerHTML = h;
    var bt = $('bt-todas');
    if (bt) bt.addEventListener('click', function () { estado.todas = true; desenharAbasELista(); });
    UI.desativarTelasAusentes($('lista'));
  }
  $('abas').addEventListener('click', function (e) {
    var b = e.target.closest('.m-aba');
    if (!b) return;
    estado.cat = b.getAttribute('data-cat'); estado.todas = false; guardar(); desenharAbasELista();
  });
  $('abas').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var abas = Array.prototype.slice.call(this.querySelectorAll('.m-aba')), i = abas.indexOf(document.activeElement);
    if (i < 0) return;
    var prox = abas[(i + (e.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length], cat = prox.getAttribute('data-cat');
    prox.click();
    var nova = this.querySelector('[data-cat="' + cat + '"]');
    if (nova) nova.focus();
  });

  // ── turno por base ──────────────────────────────────────────────────
  function desenharPorBase() {
    var t = analise.resumo.turno, linhas = analise.resumo.porBase;
    if (!t) { $('por-base').innerHTML = '<p class="m-meta">Aparece quando houver turno salvo no banco.</p>'; return; }
    if (!linhas.length) { $('por-base').innerHTML = '<p class="m-meta">Nenhuma equipe com estes filtros.</p>'; return; }
    var aviso = t.hoje ? '' : '<p class="m-stat-aviso" style="margin-bottom:6px">Turno de ' + esc(util.br(util.dataDe(t.data))) + '. O de hoje ainda não foi importado.</p>';
    $('por-base').innerHTML = aviso + linhas.map(function (l) {
      return '<div style="display:flex;flex-direction:column;gap:5px;padding:8px 0;border-bottom:1px solid #edf2f7">' +
        '<div style="display:flex;justify-content:space-between;gap:8px"><span class="m-tit">' + esc(l.base ? l.base.nome : 'Sem base definida') + '</span>' +
        '<span class="m-num">' + l.ok + ' <span class="m-meta">de ' + l.total + '</span></span></div>' + barra(l.ok, l.justif, l.falta) +
        (l.falta ? '<span class="m-meta">' + l.falta + ' sem abrir' + (l.justif ? ', ' + l.justif + ' justificadas' : '') + '</span>' : '') + '</div>';
    }).join('') + '<p class="m-meta" style="margin-top:10px">Verde: abriu. Amarelo: justificada. Vermelho: sem abrir.</p>';
  }

  // ── fontes de dados ─────────────────────────────────────────────────
  function desenharFontes() {
    var r = analise.resumo, hoje = new Date();
    var h = analise.fontes.map(function (f) {
      var st = 'ok', texto = f.atualizado ? UI.relativo(f.atualizado) : 'sem data';
      if (!f.existe) { st = 'ausente'; texto = 'não encontrada'; }
      else if (f.chave === 'turno' && r.turno && !r.turno.hoje) { st = 'velha'; texto = 'último turno ' + r.turno.data; }
      else if (f.chave === 'rdo_atual' && r.rdo && !r.rdo.valido) { st = 'velha'; texto = r.rdo.data ? 'RDO de ' + util.br(r.rdo.data) : 'sem RDO'; }
      else if (f.chave === 'obras_base' && f.atualizado && util.diasEntre(f.atualizado, hoje) >= P.REGRAS.diasCarteiraVelha) st = 'velha';
      var cor = { ok: '#276749', velha: '#b7791f', ausente: '#a0aec0' }[st];
      var nome = UI.pode(f.tela) && f.existe ? '<a class="m-link" href="' + esc(f.tela) + '">' + esc(f.nome) + '</a>' : '<span class="m-tit">' + esc(f.nome) + '</span>';
      return '<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:.82rem;border-bottom:1px solid #edf2f7">' +
        nome + '<span style="color:' + cor + ';white-space:nowrap;font-weight:800">' + esc(texto) + '</span></div>';
    }).join('');
    h += analise.viaAnonima
      ? '<div class="m-alerta atencao" style="margin-top:12px"><i class="ti ti-lock-open" aria-hidden="true"></i><span>A leitura só funcionou com a chave pública. Peça ao administrador para liberar a leitura com login no banco (RLS).</span></div>'
      : '<p class="m-meta" style="margin-top:10px">Lido com o seu login.</p>';
    $('fontes').innerHTML = h;
    UI.desativarTelasAusentes($('fontes'));
  }

  // ── ações do cabeçalho ──────────────────────────────────────────────
  $('bt-atualizar').addEventListener('click', function () { atualizar(true); });
  $('bt-imprimir').addEventListener('click', function () { window.print(); });
  $('bt-copiar').addEventListener('click', function () {
    if (!analise) return;
    var rot = [];
    if (estado.base) { var b = analise.opcoes.bases.filter(function (x) { return x.id === estado.base; })[0]; if (b) rot.push(b.nome); }
    if (estado.sup) rot.push(estado.sup);
    UI.copiar(P.resumoTexto(analise, rot.join(', '))).then(function () { UI.toast('Resumo copiado. Cole no WhatsApp.'); },
      function () { UI.toast('Não foi possível copiar neste navegador.'); });
  });

  // ── início ──────────────────────────────────────────────────────────
  UI.esperarLogin().then(function () {
    atualizar(false);
    setInterval(function () { if (!document.hidden) atualizar(false); }, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && Date.now() - ultimaLeitura > 5 * 60 * 1000) atualizar(false);
    });
  });
})();
</script>
</body>
</html>
