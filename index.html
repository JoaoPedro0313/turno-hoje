<script src="mariua-painel.js?v=4"></script>
<script>
/* Confere se os arquivos desta tela chegaram junto com esta página.
   Se faltar algum, mostra qual é em vez de abrir a tela quebrada. */
(function () {
  var falta = [];
  try { var tb = document.querySelector('.top-bar'); if (tb && getComputedStyle(tb).position !== 'fixed') falta.push('mariua-ui.css'); } catch (e) {}
  if (!window.MariuaUI) falta.push('mariua-ui.js');
  if (!window.MariuaPainel) falta.push('mariua-painel.js');
  try {
    var nav = window.mariuaNav && window.mariuaNav.itens, temPainel = false;
    if (nav) nav.grupos.forEach(function (g) { g.itens.forEach(function (i) { if (/painel\.html$/i.test(i.href)) temPainel = true; }); });
    if (nav && !temPainel) falta.push('nav.js (a versão nova, com o Painel do dia)');
  } catch (e) {}
  if (!falta.length) return;
  window.__MARIUA_FALTA = falta;
  console.error('[mariua] Arquivos faltando ou antigos nesta pasta:', falta.join(', '));
  if (falta.indexOf('mariua-ui.js') < 0 && falta.indexOf('mariua-ui.css') < 0 && falta.indexOf('mariua-painel.js') < 0) return;
  var caixa = document.createElement('div');
  caixa.setAttribute('role', 'alert');
  caixa.style.cssText = 'font-family:Barlow,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:22px 24px;border:2px solid #F3C3B4;border-radius:12px;background:#FFF4F1;color:#5C1610;line-height:1.5';
  caixa.innerHTML = '<div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">Faltam arquivos desta tela no site</div>' +
    '<div style="font-size:.95rem">Copie para a <b>mesma pasta</b> deste arquivo, sem subpasta:</div>' +
    '<ul style="margin:10px 0 12px;padding-left:20px;font-size:.95rem">' + falta.map(function (f) { return '<li><code>' + f + '</code></li>'; }).join('') + '</ul>' +
    '<div style="font-size:.9rem">Depois do envio, espere o site atualizar (cerca de 1 minuto no GitHub Pages) e recarregue com <b>Ctrl+F5</b>.</div>';
  var main = document.querySelector('main');
  if (main) main.innerHTML = '';
  document.body.insertBefore(caixa, document.body.firstChild);   /* primeira coisa da tela, mesmo sem o CSS */
})();
</script>
<script>
(function () {
  'use strict';
  if (window.__MARIUA_FALTA && (!window.MariuaPainel || !window.MariuaUI)) return;
  var P = window.MariuaPainel, UI = window.MariuaUI, util = P.util, esc = UI.esc;
  var NIVEL = { critico: ['Crítico', 'alert-octagon'], atencao: ['Atenção', 'alert-triangle'], aviso: ['Aviso', 'info-circle'] };
  /* mesmas cores por tela do Início antigo */
  var CORES = {
    'painel.html': ['#c05621', '#fdefe4'], 'turno.html': ['#0d7377', '#eef6f5'], 'rdo.html': ['#2b6cb0', '#eaf2fb'],
    'prog.html': ['#6b46c1', '#f3effd'], 'projeçao.html': ['#b7791f', '#fdf6e3'], 'mapa.html': ['#38a169', '#eefaf1'],
    'estagios.html': ['#0d7377', '#eef6f5'], 'ocorrencias.html': ['#c05621', '#fdefe4'], 'producao.html': ['#bd5c18', '#fbeee2'], 'faturamento.html': ['#0b6e5f', '#e3f3ef'], 'comp.html': ['#2b6cb0', '#eaf2fb'],
    'neoex.html': ['#805ad5', '#f4effd'], 'cadastro_obra.html': ['#c05621', '#fdefe4'], 'equipes.html': ['#0d7377', '#eef6f5'],
    'permissoes.html': ['#2b6cb0', '#eaf2fb'], 'vencimento_cursos.html': ['#c53030', '#fdecec'], 'ensaios.html': ['#38a169', '#eefaf1'],
    'brigada.html': ['#c05621', '#fdefe4'], 'valores.html': ['#276749', '#eefaf1'], 'fator_k.html': ['#0d7377', '#eef6f5'],
    'admin.html': ['#553c9a', '#f3effd']
  };
  var SO_GESTOR = { 'valores.html': 1, 'fator_k.html': 1, 'admin.html': 1 };
  function $(id) { return document.getElementById(id); }
  function arq(h) { var a = String(h || '').split('/').pop(); try { a = decodeURIComponent(a).normalize('NFC'); } catch (e) {} return a.toLowerCase(); }
  function cor(h) { return CORES[arq(h)] || ['#0d7377', '#eef6f5']; }
  function cartao(href, icone, titulo, desc, extra, cores, quando) {
    var c = cores || cor(href);
    return '<a class="lx-card" href="' + esc(href) + '" style="--cc:' + c[0] + ';--cbg:' + c[1] + '">' +
      '<span class="lx-ic"><i class="ti ti-' + esc(icone) + '" aria-hidden="true"></i></span>' +
      '<span class="lx-tx"><span class="lx-tit">' + esc(titulo) + (extra || '') + '</span>' + (desc ? '<span class="lx-desc">' + esc(desc) + '</span>' : '') + '</span>' +
      (quando ? '<span class="lx-quando">' + esc(quando) + '</span>' : '') + '</a>';
  }

  // ── saudação ────────────────────────────────────────────────────────
  function primeiroNome(n) {
    n = String(n || '').trim();
    if (n.indexOf('@') > 0) n = n.split('@')[0].replace(/[._-]+/g, ' ');
    var p = n.split(/\s+/)[0] || '';
    return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
  }
  function saudar(u) {
    var h = new Date().getHours(), gr = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    var nome = primeiroNome(u && (u.nome || u.email));
    $('saudacao').textContent = nome ? gr + ', ' + nome : gr + ' · Sistema de Obras';
    $('sub').textContent = UI.dataLonga(new Date()) + ' · Mariuá Construção e Energia';
  }

  // ── indicadores e pendências ────────────────────────────────────────
  function kpi(href, cores, icone, valor, rotulo, extra, erro) {
    if (href && !UI.pode(href)) return '';
    var tag = erro === 'falha' ? 'div' : 'a';
    return '<' + tag + ' class="kpi"' + (tag === 'a' ? ' href="' + href + '"' : '') + ' style="--kc:' + cores[0] + ';--kbg:' + cores[1] + '">' +
      '<span class="kpi-ic"><i class="ti ti-' + icone + '" aria-hidden="true"></i></span>' +
      '<span class="kpi-main"><span class="kpi-num' + (valor === null ? ' loading' : '') + '">' + (valor === null ? '—' : valor) + '</span>' +
      '<span class="kpi-lbl">' + rotulo + '</span>' + (extra ? '<span class="kpi-ext' + (erro === 'aviso' ? ' aviso' : erro ? ' erro' : '') + '">' + extra + '</span>' : '') + '</span></' + tag + '>';
  }
  var K = {
    turno: ['turno.html', ['#0d7377', '#eef6f5'], 'clipboard-check', 'Turnos abertos'],
    rdo: ['rdo.html', ['#2b6cb0', '#eaf2fb'], 'file-description', 'RDO lançados'],
    prog: ['prog.html', ['#6b46c1', '#f3effd'], 'calendar-event', 'Programado executado'],
    cursos: ['vencimento_cursos.html', ['#c53030', '#fdecec'], 'certificate', 'Cursos vencidos']
  };
  function k(id, valor, extra, erro) { var x = K[id]; return kpi(x[0], x[1], x[2], valor, x[3], extra, erro); }
  function desenharNumeros(a, err) {
    var h;
    if (err) {
      h = k('turno', '—', 'Não carregou', 'falha') + k('rdo', '—', 'Não carregou', 'falha') + k('prog', '—', 'Não carregou', 'falha') + k('cursos', '—', 'Não carregou', 'falha');
    } else if (!a) {
      h = k('turno', null) + k('rdo', null) + k('prog', null) + k('cursos', null);
    } else {
      var r = a.resumo, t = r.turno, d = r.rdo, e = r.execucao, c = r.cursos;
      var totT = t ? t.ok + t.justif + t.falta : 0, dT = t ? util.br(util.dataDe(t.data)) : '';
      /* Sem dado de hoje: mostra o último disponível, com a data e o aviso em âmbar */
      h = (!t || !totT ? k('turno', '—', 'Nenhum turno no banco', true)
        : t.hoje ? k('turno', t.ok + ' <small>de ' + totT + '</small>', (t.falta ? t.falta + ' sem abrir' : 'Todas abriram') +
            (t.horas ? ' · das ' + t.horas.primeiro + ' às ' + t.horas.ultimo : ''))
        : k('turno', t.ok + ' <small>de ' + totT + '</small>', 'Turno de ' + dT + ' · hoje ainda não importado', 'aviso'));
      h += (!d || !d.lancou ? k('rdo', '—', d && d.data ? 'Sem RDO desde ' + util.br(d.data) : 'Nenhum RDO no banco', true)
        : d.valido ? k('rdo', String(d.lancou), (d.nao ? d.nao + ' sem RDO' : 'Todas lançaram') + ' · ' + util.br(d.data))
        : k('rdo', String(d.lancou), 'RDO de ' + util.br(d.data) + ' · sem importar desde então', 'aviso'));
      if (!e || !e.frentes) h += k('prog', '—', 'Nenhuma programação no banco', true);
      else {
        var pctE = e.pct != null ? e.pct : e.pctQtd;
        var valE = pctE != null ? Math.round(pctE * 100) + '%' : e.frentes + ' <small>frentes</small>';
        var extE = e.pct != null ? UI.moeda(e.realizado, true) + ' de ' + UI.moeda(e.previsto, true) + ' · ' + util.br(e.data)
                 : e.pctQtd != null ? 'Pela quantidade, sem valor do fator K · ' + util.br(e.data)
                 : 'Em ' + util.br(e.data) + ', sem quantidade prevista';
        h += e.recente ? k('prog', valE, extE) : k('prog', valE, 'Em ' + util.br(e.data) + ' · sem programação depois disso', 'aviso');
      }
      h += c ? k('cursos', String(c.vencidos), c.proximos ? c.proximos + ' vencem em ' + P.REGRAS.diasAvisoVencimento + ' dias' : 'Nenhum vencendo')
        : k('cursos', '—', 'Sem dados de cursos');
    }
    $('numeros').innerHTML = h;
    $('numeros').hidden = !h;
    UI.desativarTelasAusentes($('numeros'));
  }
  function desenharPendencias(a) {
    if (!UI.podeId('painel')) return;
    var grupos = P.agrupar(a.itens);
    $('pend-hora').textContent = 'Atualizado às ' + UI.hora(a.em);
    if (!grupos.length) {
      $('pend-lista').innerHTML = '<div class="m-vazio"><i class="ti ti-circle-check" aria-hidden="true"></i><span>Nada fora do previsto agora.</span></div>';
      $('pend-rodape').hidden = true;
      return;
    }
    $('pend-lista').innerHTML = grupos.slice(0, 5).map(function (g) {
      var n = NIVEL[g.nivel];
      var acao = g.acao && UI.pode(g.acao.href) ? '<a class="m-bt m-bt-peq" href="' + esc(g.acao.href) + '">' + esc(g.acao.texto) + '</a>' : '';
      return '<div class="m-pend"><span class="m-niv ' + g.nivel + '"><i class="ti ti-' + n[1] + '" aria-hidden="true"></i></span>' +
        '<div class="m-pend-txt"><b>' + esc(g.titulo) + '</b><span>' + esc(g.detalhe || '') + '</span></div>' +
        '<span class="m-selo ' + g.nivel + '">' + n[0] + '</span>' + acao + '</div>';
    }).join('');
    UI.desativarTelasAusentes($('pend-lista'));
    $('pend-rodape').hidden = false;
    $('pend-rodape').innerHTML = '<a class="m-link" href="painel.html">' +
      (a.itens.length === 1 ? 'Ver a pendência no Painel do dia' : 'Ver as ' + a.itens.length + ' pendências no Painel do dia') + '</a>';
  }
  function carregarDados() {
    UI.sinc('lendo', 'Atualizando…');
    return P.carregar().then(function (bruto) {
      var a = P.analisar(bruto, { estados: P.estadosDoUsuario(bruto, window.MARIUA_USER) });
      desenharPendencias(a);
      desenharNumeros(a, null);
      desenharTelas();
      UI.sinc('ok', 'Banco online · ' + UI.hora(bruto.em));
    }).catch(function (err) {
      console.error('[inicio]', err);
      UI.sinc('erro', 'Sem conexão');
      desenharNumeros(null, err);
      $('pend-lista').innerHTML = '<div class="m-erro"><i class="ti ti-plug-connected-x" aria-hidden="true"></i>' +
        '<span>Não foi possível ler as pendências: ' + esc(err.message) + '</span>' +
        '<button type="button" class="m-bt m-bt-peq" data-tentar>Tentar de novo</button></div>';
    });
  }
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('[data-tentar]')) carregarDados(); });
  $('db-badge').addEventListener('click', function () { carregarDados(); });
  $('db-badge').style.cursor = 'pointer';

  // ── continuar de onde parou (tabela acessos) ────────────────────────
  function carregarRecentes(u) {
    var sb = window.MARIUA_SB;
    if (!sb || !u.email) return;
    sb.from('acessos').select('tela,tela_nome,arquivo,em,ultimo_em').eq('email', u.email).eq('bloqueado', false)
      .order('em', { ascending: false }).limit(60).then(function (r) {
        if (r.error || !r.data) return;
        var vistos = {}, lista = [];
        r.data.forEach(function (x) {
          var a = arq(x.arquivo);
          if (!a || a === 'index.html' || vistos[a] || !UI.pode(a)) return;
          vistos[a] = 1; lista.push(x);
        });
        lista = lista.slice(0, 4);
        if (!lista.length) return;
        var telas = UI.telas();
        $('recentes').innerHTML = lista.map(function (x) {
          var a = arq(x.arquivo), t = telas.filter(function (tt) { return arq(tt.href) === a; })[0];
          var info = UI.infoTela(a) || [x.tela_nome || a, ''];
          return cartao(t ? t.href : a, t ? t.icone : 'file', info[0], info[1], '', null, UI.relativo(new Date(x.ultimo_em || x.em)));
        }).join('');
        $('sec-recentes').hidden = false;
      }, function () {});
  }

  // ── telas, obras e equipes (busca) ──────────────────────────────────
  var TELAS = [];
  function desenharTelas() {
    var q = util.norm($('telas-q').value), grupos = {}, ordem = [];
    TELAS.forEach(function (t) {
      if (t.oculta) return;
      if (q && util.norm(t.texto + ' ' + t.desc + ' ' + t.chaves + ' ' + t.grupo).indexOf(q) < 0) return;
      var g = t.grupo || 'Geral';
      if (!grupos[g]) { grupos[g] = []; ordem.push(g); }
      grupos[g].push(t);
    });
    var h = ordem.map(function (g) {
      return '<div class="lx-sec"><div class="lx-sec-tit">' + esc(g) + '</div><div class="lx-grid">' + grupos[g].map(function (t) {
        return cartao(t.href, t.icone, t.texto, t.desc, SO_GESTOR[arq(t.href)] ? ' <span class="m-selo aviso" style="padding:1px 6px">gestor</span>' : '');
      }).join('') + '</div></div>';
    }).join('');
    var dados = P.ultimo, achou = ordem.length;
    if (dados && q.length >= 3) {
      var obras = dados.busca.obras.filter(function (o) { return util.norm(o.pep + ' ' + o.titulo + ' ' + o.mun + ' ' + o.enc).indexOf(q) >= 0; }).slice(0, 8);
      if (obras.length && UI.pode('mapa.html')) {
        achou++;
        h += '<div class="lx-sec"><div class="lx-sec-tit">Obras na carteira</div><div class="lx-grid">' + obras.map(function (o) {
          return cartao('mapa.html', 'building', o.pep, [o.titulo, util.nomeProprio(o.mun), o.statusTxt].filter(Boolean).join(' · '), '', ['#38a169', '#eefaf1']);
        }).join('') + '</div></div>';
      }
      var SIT = { ok: 'abriu turno', justif: 'falta justificada', falta: 'não abriu' };
      var eqs = dados.busca.equipes.filter(function (e) { return util.norm(e.codigo + ' ' + e.enc + ' ' + e.sup).indexOf(q) >= 0; }).slice(0, 8);
      if (eqs.length && UI.pode('turno.html')) {
        achou++;
        h += '<div class="lx-sec"><div class="lx-sec-tit">Equipes de hoje</div><div class="lx-grid">' + eqs.map(function (e) {
          return cartao('turno.html', 'users', e.codigo, [e.enc ? util.nomeProprio(e.enc) : '', (SIT[e.turno] || '') + (e.hora ? ' às ' + e.hora : '')].filter(Boolean).join(' · '), '', ['#0d7377', '#eef6f5']);
        }).join('') + '</div></div>';
      }
    }
    $('telas').innerHTML = h;
    $('telas-vazio').hidden = achou > 0;
  }
  function montarTelas() {
    TELAS = UI.telas().filter(function (t) { return arq(t.href) !== 'index.html'; });
    desenharTelas();
    TELAS.forEach(function (t) {
      if (!t.extra) return;
      UI.telaExiste(t.href).then(function (existe) { if (!existe) { t.oculta = true; desenharTelas(); } });
    });
  }
  $('telas-q').addEventListener('input', desenharTelas);

  // ── início ──────────────────────────────────────────────────────────
  saudar(null);
  desenharNumeros(null, null);
  UI.esperarLogin().then(function (u) {
    saudar(u);
    montarTelas();
    var verPainel = UI.podeId('painel');
    $('bt-painel').hidden = !verPainel;
    $('sec-pend').hidden = !verPainel;
    carregarDados();
    carregarRecentes(u);
    setInterval(function () { if (!document.hidden) carregarDados(); }, 5 * 60 * 1000);
  });
})();
</script>
</body>
</html>
