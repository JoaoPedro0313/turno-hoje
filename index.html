<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>/* tema escuro: evita piscar branco enquanto carrega */try{if(localStorage.getItem("mariua_darkmode")==="1"){document.documentElement.style.background="#0C1112"}}catch(e){}</script>
<!-- TRAVA DE ACESSO — não remova. Esconde a página ANTES de qualquer script e só
     libera se o mariua-auth.js tiver realmente carregado. -->
<script>(function(){var h=document.documentElement;h.className+=' mariua-check';
var s=document.createElement('style');s.id='mariua-lock';
s.textContent='html.mariua-check body>*{visibility:hidden!important}#mariua-ovl,#mariua-ovl *{visibility:visible!important}';
(document.head||h).appendChild(s);
setTimeout(function(){if(window.__MARIUA_AUTH__)return;
h.className=h.className.replace(/\bmariua-check\b/,'');
var d=document.body||h;d.innerHTML='<div style="font-family:Barlow,system-ui,sans-serif;max-width:420px;margin:14vh auto;padding:26px;border:2px solid #fed7d7;border-radius:14px;background:#fff5f5;text-align:center;color:#742a2a"><div style="font-size:1.05rem;font-weight:900;margin-bottom:8px">Login não carregou</div><div style="font-size:.85rem;font-weight:600;line-height:1.5">O arquivo <b>mariua-auth.js</b> não foi encontrado nesta pasta. Sem ele o sistema não libera o acesso.</div><button onclick="location.reload()" style="margin-top:16px;padding:10px 22px;border:none;border-radius:9px;background:#c53030;color:#fff;font-family:Barlow,sans-serif;font-weight:800;cursor:pointer">Recarregar</button></div>';},8000);})();</script>
<script src="mariua-auth.js?v=3"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início · Mariuá Sistema de Obras</title>
<link rel="icon" href="assets/logo-mariua.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="mariua-ui.css?v=1">
<style id="dark-mode-css" data-tema="proprio"></style>
<style>
  .i-numeros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .i-numeros .m-stat { border-right: 1px solid var(--m-linha2); border-bottom: 1px solid var(--m-linha2); }
  .i-numeros .m-stat:nth-child(2n) { border-right: 0; }
  .i-recente { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 6px 12px; border-radius: 8px; background: var(--m-sub); text-decoration: none; color: inherit; }
  .i-recente:hover { background: var(--m-teal-claro); }
  .i-recente b { display: block; font-weight: 600; }
  .i-recente small { display: block; font-size: 13px; color: var(--m-tinta2); }
  .i-grupo { display: flex; flex-direction: column; gap: 10px; }
  .i-grupo h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--m-tinta2); }
  .i-telas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .i-tela { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--m-linha); background: var(--m-cartao); text-decoration: none; color: inherit; min-height: 64px; }
  .i-tela:hover { border-color: var(--m-teal); background: var(--m-teal-50); }
  .i-tela .ti { font-size: 22px; color: var(--m-teal); flex-shrink: 0; }
  body.dark .i-tela .ti { color: var(--m-link); }
  .i-tela b { display: block; font-weight: 700; }
  .i-tela small { display: block; font-size: 13px; color: var(--m-tinta2); }
  @media (max-width: 520px) { .i-numeros { grid-template-columns: minmax(0, 1fr); } .i-numeros .m-stat { border-right: 0; } }
</style>
</head>
<body>

<header class="m-topo">
  <button type="button" class="m-topo-menu" onclick="smToggle()" aria-label="Abrir o menu"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
  <a class="m-marca" href="index.html"><img src="assets/logo-mariua.png" alt=""><b>Mariuá</b><span>Sistema de Obras</span></a>
  <div class="m-busca">
    <label for="m-busca-campo"><i class="ti ti-search" aria-hidden="true"></i>
      <input id="m-busca-campo" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar obra, equipe ou tela"
             role="combobox" aria-expanded="false" aria-controls="m-busca-res" aria-autocomplete="list">
      <span class="m-kbd">Ctrl K</span>
    </label>
    <div id="m-busca-res" class="m-busca-res" role="listbox" aria-label="Resultados da busca"></div>
  </div>
  <div class="m-topo-dir">
    <span class="m-sinc" id="m-sinc" data-estado="lendo"><i aria-hidden="true"></i><span>Carregando…</span></span>
    <button type="button" id="user-avatar" class="m-avatar" onclick="if(window.mariuaPerfil)window.mariuaPerfil()" aria-label="Minha conta">·</button>
  </div>
</header>

<aside class="sm-side">
  <!-- Menu montado por nav.js — NÃO edite os itens aqui, edite a lista em nav.js -->
  <nav class="sm-nav"><a class="sm-item" href="index.html"><span class="sm-ic"><i class="ti ti-home"></i></span><span class="sm-tx">Início</span></a></nav>
</aside>
<script src="nav.js?v=5"></script>

<main class="m-pagina">
  <div class="m-cab">
    <div>
      <h1 id="saudacao">Sistema de Obras</h1>
      <p id="sub">Mariuá Construção e Energia</p>
    </div>
    <div class="m-acoes"><a class="m-bt m-bt-pri" href="painel.html" id="bt-painel" hidden>Abrir o Painel do dia</a></div>
  </div>

  <section class="m-cartao" id="sec-pend" aria-labelledby="t-pend" hidden>
    <div class="m-cartao-cab">
      <h2 class="m-h2" id="t-pend">Precisa de atenção hoje</h2>
      <span class="m-meta" id="pend-hora"></span>
    </div>
    <div id="pend-lista">
      <div class="m-cartao-corpo" style="display:flex;flex-direction:column;gap:14px">
        <div class="m-esq"></div><div class="m-esq" style="width:80%"></div><div class="m-esq" style="width:65%"></div>
      </div>
    </div>
    <div class="m-cartao-corpo" id="pend-rodape" hidden></div>
  </section>

  <div class="m-grade">
    <section class="m-cartao" id="sec-numeros" aria-labelledby="t-num" hidden>
      <div class="m-cartao-cab"><h2 class="m-h2" id="t-num">Números de hoje</h2></div>
      <div class="i-numeros" id="numeros"></div>
    </section>
    <section class="m-cartao" id="sec-recentes" aria-labelledby="t-rec" hidden>
      <div class="m-cartao-cab"><h2 class="m-h2" id="t-rec">Continuar de onde parou</h2></div>
      <div class="m-cartao-corpo" id="recentes" style="display:flex;flex-direction:column;gap:8px"></div>
    </section>
  </div>

  <section aria-labelledby="t-telas" style="display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
      <h2 class="m-h2" id="t-telas">Suas telas</h2>
      <label class="m-procura" style="flex:0 1 340px;background:var(--m-cartao)"><i class="ti ti-search" aria-hidden="true"></i>
        <input type="search" id="telas-q" placeholder="Filtrar telas, ex.: mapa, extintor, poste" aria-label="Filtrar telas">
      </label>
    </div>
    <div id="telas" style="display:flex;flex-direction:column;gap:22px"></div>
    <p class="m-meta" id="telas-vazio" hidden>Nenhuma tela encontrada com esse filtro.</p>
  </section>
</main>

<script src="identidade.js?v=3"></script>
<script src="mariua-ui.js?v=1"></script>
<script src="mariua-painel.js?v=1"></script>
<script>
/* Confere se os arquivos do visual novo chegaram junto com esta página.
   Se faltar algum, mostra qual é em vez de abrir a tela quebrada. */
(function () {
  var falta = [];
  try { if (!getComputedStyle(document.documentElement).getPropertyValue('--m-topo').trim()) falta.push('mariua-ui.css'); } catch (e) {}
  if (!window.MariuaUI) falta.push('mariua-ui.js');
  if (!window.MariuaPainel) falta.push('mariua-painel.js');
  try {
    var nav = window.mariuaNav && window.mariuaNav.itens, temPainel = false;
    if (nav) nav.grupos.forEach(function (g) { g.itens.forEach(function (i) { if (/painel\.html$/i.test(i.href)) temPainel = true; }); });
    if (nav && !temPainel) falta.push('nav.js (a versão nova, com o Painel do dia)');
  } catch (e) {}
  if (!falta.length) return;
  window.__MARIUA_FALTA = falta;
  console.error('[mariua] Arquivos faltando ou antigos nesta pasta:', falta.join(', '));
  if (falta.indexOf('mariua-ui.js') < 0 && falta.indexOf('mariua-ui.css') < 0 && falta.indexOf('mariua-painel.js') < 0) return;
  var caixa = document.createElement('div');
  caixa.setAttribute('role', 'alert');
  caixa.style.cssText = 'font-family:Barlow,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:22px 24px;border:2px solid #F3C3B4;border-radius:12px;background:#FFF4F1;color:#5C1610;line-height:1.5';
  caixa.innerHTML = '<div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">Faltam arquivos desta tela no site</div>' +
    '<div style="font-size:.95rem">Copie para a <b>mesma pasta</b> deste arquivo, sem subpasta:</div>' +
    '<ul style="margin:10px 0 12px;padding-left:20px;font-size:.95rem">' + falta.map(function (f) { return '<li><code>' + f + '</code></li>'; }).join('') + '</ul>' +
    '<div style="font-size:.9rem">Depois do envio, espere o site atualizar (cerca de 1 minuto no GitHub Pages) e recarregue com <b>Ctrl+F5</b>.</div>';
  var main = document.querySelector('main');
  if (main) main.innerHTML = '';
  document.body.insertBefore(caixa, document.body.firstChild);   /* primeira coisa da tela, mesmo sem o CSS */
})();
</script>
<script>
(function () {
  'use strict';
  if (window.__MARIUA_FALTA && (!window.MariuaPainel || !window.MariuaUI)) return;
  var P = window.MariuaPainel, UI = window.MariuaUI, util = P.util, esc = UI.esc;
  var NIVEL = { critico: ['Crítico', 'alert-octagon'], atencao: ['Atenção', 'alert-triangle'], aviso: ['Aviso', 'info-circle'] };
  function $(id) { return document.getElementById(id); }

  // ── saudação ────────────────────────────────────────────────────────
  function primeiroNome(n) {
    n = String(n || '').trim();
    if (n.indexOf('@') > 0) n = n.split('@')[0].replace(/[._-]+/g, ' ');
    var p = n.split(/\s+/)[0] || '';
    return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
  }
  function saudar(u) {
    var h = new Date().getHours(), gr = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    var nome = primeiroNome(u && (u.nome || u.email));
    $('saudacao').textContent = nome ? gr + ', ' + nome : gr;
    $('sub').textContent = UI.dataLonga(new Date()) + '.';
  }

  // ── pendências e números ────────────────────────────────────────────
  function carregarDados() {
    UI.sinc('lendo', 'Atualizando…');
    return P.carregar().then(function (bruto) {
      var a = P.analisar(bruto, { estados: P.estadosDoUsuario(bruto, window.MARIUA_USER) });
      desenharPendencias(a);
      desenharNumeros(a, null);
      UI.sinc('ok', 'Atualizado às ' + UI.hora(bruto.em));
    }).catch(function (err) {
      console.error('[inicio]', err);
      UI.sinc('erro', 'Sem conexão com o banco');
      desenharNumeros(null, err);
      $('pend-lista').innerHTML = '<div class="m-erro"><i class="ti ti-plug-connected-x" aria-hidden="true"></i>' +
        '<span>Não foi possível ler as pendências: ' + esc(err.message) + '</span>' +
        '<button type="button" class="m-bt m-bt-peq" data-tentar>Tentar de novo</button></div>';
    });
  }
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('[data-tentar]')) carregarDados(); });

  function desenharPendencias(a) {
    if (!UI.podeId('painel')) return;
    var grupos = P.agrupar(a.itens);
    $('pend-hora').textContent = 'Atualizado às ' + UI.hora(a.em);
    if (!grupos.length) {
      $('pend-lista').innerHTML = '<div class="m-vazio"><i class="ti ti-circle-check" aria-hidden="true"></i><span>Nada fora do previsto agora.</span></div>';
      $('pend-rodape').hidden = true;
      return;
    }
    $('pend-lista').innerHTML = grupos.slice(0, 5).map(function (g) {
      var n = NIVEL[g.nivel];
      var acao = g.acao && UI.pode(g.acao.href) ? '<a class="m-bt m-bt-peq" href="' + esc(g.acao.href) + '">' + esc(g.acao.texto) + '</a>' : '';
      return '<div class="m-pend"><span class="m-niv ' + g.nivel + '"><i class="ti ti-' + n[1] + '" aria-hidden="true"></i></span>' +
        '<div class="m-pend-txt"><b>' + esc(g.titulo) + '</b><span>' + esc(g.detalhe || '') + '</span></div>' +
        '<span class="m-selo ' + g.nivel + '">' + n[0] + '</span>' + acao + '</div>';
    }).join('');
    UI.desativarTelasAusentes($('pend-lista'));
    $('pend-rodape').hidden = false;
    $('pend-rodape').innerHTML = '<a class="m-link" href="painel.html">' +
      (a.itens.length === 1 ? 'Ver a pendência no Painel do dia' : 'Ver as ' + a.itens.length + ' pendências no Painel do dia') + '</a>';
  }

  function numero(href, rot, valor, extra, erro, semLink) {
    if (href && !UI.pode(href)) return '';
    var tag = semLink ? 'div' : 'a';
    return '<' + tag + ' class="m-stat"' + (semLink ? '' : ' href="' + href + '"') + '><span class="m-stat-rot">' + rot + '</span>' +
      '<span class="m-stat-val">' + valor + '</span>' +
      (extra ? '<span class="' + (erro ? 'm-stat-erro' : 'm-stat-ext') + '">' + extra + '</span>' : '') + '</' + tag + '>';
  }
  function desenharNumeros(a, err) {
    var h = '';
    if (err) {
      var falha = 'Não carregou.';
      h = numero('turno.html', 'Turnos abertos', '—', falha, true, true) + numero('rdo.html', 'RDO lançados', '—', falha, true, true) +
          numero('prog.html', 'Programado executado', '—', falha, true, true) + numero('vencimento_cursos.html', 'Cursos vencidos', '—', falha, true, true);
      if (h) h += '<div class="m-stat" style="grid-column:1/-1"><button type="button" class="m-bt m-bt-peq" data-tentar style="align-self:flex-start">Tentar de novo</button></div>';
    } else {
      var r = a.resumo, t = r.turno, d = r.rdo, e = r.execucao, c = r.cursos;
      h += !t ? numero('turno.html', 'Turnos abertos', '—', 'Nenhum turno no banco.', true)
        : !t.hoje ? numero('turno.html', 'Turnos abertos', '—', 'Hoje ainda não importado. Último: ' + esc(t.data) + '.', true)
        : numero('turno.html', 'Turnos abertos', t.ok + ' <small>de ' + (t.ok + t.justif + t.falta) + '</small>', t.falta ? t.falta + ' sem abrir' : 'Todas abriram');
      h += !d ? numero('rdo.html', 'RDO lançados', '—', 'Nenhum RDO no banco.', true)
        : !d.valido ? numero('rdo.html', 'RDO lançados', '—', d.data ? 'Sem importar desde ' + util.br(d.data) + '.' : 'Ainda não importado.', true)
        : numero('rdo.html', 'RDO de ' + util.br(d.data), d.lancou + ' <small>lançados</small>', d.nao ? d.nao + ' equipes sem RDO' : 'Todas lançaram');
      h += (e && e.pct != null)
        ? numero('prog.html', 'Programado executado', Math.round(e.pct * 100) + '%', UI.moeda(e.realizado, true) + ' de ' + UI.moeda(e.previsto, true) + ' em ' + util.br(e.data))
        : numero('prog.html', 'Programado executado', '—', 'Sem programação nos últimos 7 dias.');
      h += c ? numero('vencimento_cursos.html', 'Cursos vencidos', String(c.vencidos), c.proximos ? c.proximos + ' vencem em ' + P.REGRAS.diasAvisoVencimento + ' dias' : 'Nenhum vencendo em breve')
             : numero('vencimento_cursos.html', 'Cursos vencidos', '—', 'Sem dados de cursos no banco.');
    }
    $('numeros').innerHTML = h;
    $('sec-numeros').hidden = !h;
    UI.desativarTelasAusentes($('numeros'));
  }

  // ── recentes (tabela acessos) ───────────────────────────────────────
  function carregarRecentes(u) {
    var sb = window.MARIUA_SB;
    if (!sb || !u.email) return;
    sb.from('acessos').select('tela,tela_nome,arquivo,em,ultimo_em').eq('email', u.email).eq('bloqueado', false)
      .order('em', { ascending: false }).limit(60).then(function (r) {
        if (r.error || !r.data) return;
        var vistos = {}, lista = [];
        r.data.forEach(function (x) {
          var arq = String(x.arquivo || '').split('/').pop().toLowerCase();
          if (!arq || arq === 'index.html' || vistos[arq] || !UI.pode(arq)) return;
          vistos[arq] = 1;
          lista.push(x);
        });
        lista = lista.slice(0, 4);
        if (!lista.length) return;
        $('recentes').innerHTML = lista.map(function (x) {
          var info = UI.infoTela(x.arquivo) || [x.tela_nome || x.arquivo, ''];
          var href = /cadastro_obra|neoex/i.test(x.arquivo) ? 'obras/' + String(x.arquivo).split('/').pop() : String(x.arquivo).split('/').pop();
          return '<a class="i-recente" href="' + esc(href) + '"><span><b>' + esc(info[0]) + '</b><small>' + esc(info[1]) + '</small></span>' +
                 '<span class="m-meta" style="white-space:nowrap">' + esc(UI.relativo(new Date(x.ultimo_em || x.em))) + '</span></a>';
        }).join('');
        $('sec-recentes').hidden = false;
      }, function () {});
  }

  // ── telas (vêm do menu do nav.js e do catálogo do login) ────────────
  var TELAS = [];
  function desenharTelas() {
    var q = util.norm($('telas-q').value);
    var grupos = {}, ordem = [];
    TELAS.forEach(function (t) {
      if (t.oculta) return;
      if (q && util.norm(t.texto + ' ' + t.desc + ' ' + t.chaves + ' ' + t.grupo).indexOf(q) < 0) return;
      var g = t.grupo || 'Geral';
      if (!grupos[g]) { grupos[g] = []; ordem.push(g); }
      grupos[g].push(t);
    });
    $('telas').innerHTML = ordem.map(function (g) {
      return '<div class="i-grupo"><h3>' + esc(g) + '</h3><div class="i-telas">' + grupos[g].map(function (t) {
        return '<a class="i-tela" href="' + esc(t.href) + '"><i class="ti ti-' + esc(t.icone) + '" aria-hidden="true"></i>' +
               '<span><b>' + esc(t.texto) + '</b>' + (t.desc ? '<small>' + esc(t.desc) + '</small>' : '') + '</span></a>';
      }).join('') + '</div></div>';
    }).join('');
    $('telas-vazio').hidden = ordem.length > 0;
  }
  function montarTelas() {
    TELAS = UI.telas().filter(function (t) { return !/index\.html$/i.test(t.href); });
    desenharTelas();
    TELAS.forEach(function (t) {
      if (!t.extra) return;
      UI.telaExiste(t.href).then(function (existe) { if (!existe) { t.oculta = true; desenharTelas(); } });
    });
  }
  $('telas-q').addEventListener('input', desenharTelas);

  // ── início ──────────────────────────────────────────────────────────
  saudar(null);
  UI.esperarLogin().then(function (u) {
    saudar(u);
    montarTelas();
    var verPainel = UI.podeId('painel');
    $('bt-painel').hidden = !verPainel;
    $('sec-pend').hidden = !verPainel;
    carregarDados();
    carregarRecentes(u);
    setInterval(function () { if (!document.hidden) carregarDados(); }, 5 * 60 * 1000);
  });
})();
</script>
</body>
</html>
