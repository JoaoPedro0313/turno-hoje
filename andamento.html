<title>Andamento das obras · Mariuá</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="mariua-ui.css?v=5">
<style>
/* ============================================================================
   ANDAMENTO DAS OBRAS — estilos só desta tela. A casca (barra do topo, menu,
   botões, campos) vem do mariua-ui.css, igual ao Painel do dia.
   Layout: faixa de situações (que também filtra) → filtros → lista e detalhe.
   ========================================================================== */
.an-num-tab{font-variant-numeric:tabular-nums}
.an-cond{font-family:'Barlow Semi Condensed','Barlow',sans-serif}
.m-cont{gap:14px}

/* ── carteira de relance ── */
.an-painel{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:16px 18px 12px}
.an-painel-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;margin-bottom:14px}
.an-painel-tit{margin:0;font-size:1rem;font-weight:700;color:#4a5568;display:flex;align-items:baseline;gap:8px}
.an-painel-tit b{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:2.3rem;font-weight:800;color:#1f2a35;line-height:.9;font-variant-numeric:tabular-nums}
.an-numeros{display:flex;flex-wrap:wrap;gap:10px 32px}
.an-num{display:flex;flex-direction:column;gap:2px;min-width:150px}
.an-num-rot{font-size:.74rem;font-weight:700;color:#6b7785}
.an-num-val{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:1.3rem;font-weight:800;color:#1f2a35;line-height:1.1;font-variant-numeric:tabular-nums}
.an-num-val small{font-family:'Barlow',sans-serif;font-size:.78rem;font-weight:700;color:#6b7785}
.an-num-barra{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#e2e8f0;margin-top:3px}
.an-num-barra span{background:#0d7377}

/* faixa: cada situação com largura proporcional ao número de obras */
.an-faixa{display:flex;gap:4px;align-items:stretch}
.an-seg{appearance:none;border:0;margin:0;cursor:pointer;font-family:'Barlow',sans-serif;text-align:left;color:#fff;border-radius:9px;padding:10px 12px 9px;min-width:118px;min-height:70px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:opacity .15s,transform .15s}
.an-seg b{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:1.85rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.an-seg span{font-size:.8rem;font-weight:700;line-height:1.2}
.an-seg:hover{transform:translateY(-1px)}
.an-seg.andamento{background:#2b6cb0}
.an-seg.parada{background:#c53030}
.an-seg.nao_iniciada{background:#975a16}
.an-seg.concluida{background:#2f855a}
.an-seg.cancelada{background:#4a5568}
.an-seg.todas{flex:0 0 auto;min-width:96px;background:#fff;color:#1f2a35;box-shadow:inset 0 0 0 1.5px #d5dde3}
.an-seg.vazio{opacity:.5}
.an-seg.fora{flex:0 0 auto;min-width:150px;margin-left:8px;color:#2d3748;background:repeating-linear-gradient(135deg,#f7fafc 0 8px,#edf2f7 8px 16px);box-shadow:inset 0 0 0 1.5px #a0aec0}
.an-faixa.filtrada .an-seg:not([aria-pressed="true"]){opacity:.36}
.an-faixa.filtrada .an-seg:not([aria-pressed="true"]):hover{opacity:.7}
.an-seg[aria-pressed="true"]{outline:3px solid #1f2a35;outline-offset:2px}
.an-seg.todas[aria-pressed="true"]{outline:0;box-shadow:inset 0 0 0 2px #0d7377;color:#0b5e62}
.an-seg:focus-visible{outline:3px solid #ff6b35;outline-offset:2px}

/* regras e fontes: ficam guardadas até alguém abrir */
.an-abre{margin-top:10px}
.an-abre>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:#0d7377;padding:2px 0}
.an-abre>summary::-webkit-details-marker{display:none}
.an-abre>summary .ti{font-size:15px;transition:transform .15s}
.an-abre[open]>summary .ti-chevron-right{transform:rotate(90deg)}
.an-abre-corpo{margin-top:10px;max-width:880px}
.an-regras{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;margin:0;font-size:.8rem;line-height:1.45}
.an-regras dd{margin:0;color:#2d3748;font-weight:600}
.an-rodape{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:12px 18px}
.an-rodape .an-abre{margin-top:0}

/* ── filtros ── */
.an-filtros{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.an-filtros .m-procura{flex:1 1 260px;background:#fff}
.an-bases{display:flex;flex-wrap:wrap;gap:6px}
.an-base{padding:6px 12px;border-radius:20px;border:1.5px solid #e2e8f0;background:#fff;font-family:'Barlow',sans-serif;font-size:.78rem;font-weight:800;color:#4a5568;cursor:pointer;white-space:nowrap}
.an-base span{font-weight:700;color:#8a94a0;margin-left:4px}
.an-base:hover{border-color:#14a085;color:#0d7377}
.an-base[aria-pressed="true"]{background:#0d7377;border-color:#0d7377;color:#fff}
.an-base[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.an-avisos{display:flex;flex-direction:column;gap:8px}
.an-avisos:empty{display:none}

/* ── lista e detalhe ── */
.an-split{display:grid;grid-template-columns:minmax(330px,410px) minmax(0,1fr);gap:16px;align-items:start}
.an-lista{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:clip}
.an-lista-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #edf2f7}
.an-lista-cab b{font-size:.86rem;font-weight:800;color:#1f2a35}
.an-lista-cab .m-select{font-size:.76rem;padding:5px 7px}
.an-ul{list-style:none;margin:0;padding:0}
.an-grupo{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:2;display:flex;justify-content:space-between;align-items:center;padding:7px 16px;background:#f7fafc;border-bottom:1px solid #edf2f7;font-size:.74rem;font-weight:800;color:#4a5568}
.an-grupo i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px;background:var(--fc)}
.an-item{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;width:100%;padding:11px 14px 11px 12px;border-left:4px solid var(--fc,#a0aec0);border-bottom:1px solid #edf2f7;background:#fff;cursor:pointer;font-family:'Barlow',sans-serif}
.an-item:hover{background:#f6fafa}
.an-item[aria-current="true"]{background:#eaf5f4;box-shadow:inset 0 0 0 1.5px #14a085}
.an-item:focus-visible{outline:3px solid #ff6b35;outline-offset:-3px}
.an-item-l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.an-item-pep{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:1rem;font-weight:800;color:#1f2a35}
.an-item-pct{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:1rem;font-weight:800;color:#1f2a35;font-variant-numeric:tabular-nums}
.an-item-pct.nada{color:#a0aec0;font-weight:700}
.an-item-tit{font-size:.78rem;font-weight:700;color:#4a5568;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.an-item .an-postes{height:7px}
.an-item-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:.74rem;font-weight:600;color:#6b7785}
.an-item-meta span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.an-item-meta .ti{font-size:14px}
.an-item-meta .al{color:#c53030;font-weight:800}
.an-item-meta .pd{color:#975a16;font-weight:800}
.an-item-meta .ok{color:#2f855a;font-weight:800}
.an-mais{padding:12px 16px}

/* avanço: um traço por poste quando dá para contar, barra contínua quando não */
.an-postes{display:flex;gap:2px;height:13px;width:100%}
.an-postes span{flex:1;border-radius:2px;background:#e2e8f0;min-width:1px}
.an-postes span.f{background:#0d7377}
.an-postes.gpm span.f{background:#2b8fd6}
.an-postes.ok span.f{background:#2f855a}
.an-postes.cont{gap:0;border-radius:3px;overflow:hidden}
.an-postes.cont span{border-radius:0}
.an-postes.sem{background:repeating-linear-gradient(135deg,#edf2f7 0 6px,#f7fafc 6px 12px);border-radius:3px}

.an-det{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 78px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.an-d{padding:18px 22px 24px}
.an-d-vazio{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 20px;color:#8a94a0;font-weight:700;font-size:.9rem;text-align:center}
.an-d-vazio .ti{font-size:34px;color:#14a085}
.an-voltar{display:none}
.an-d-l1{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.an-d-pep{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:1.75rem;font-weight:800;color:#1f2a35;line-height:1;outline:0}
.an-d-tit{margin:8px 0 4px;font-size:1rem;font-weight:800;color:#1f2a35;line-height:1.3}
.an-d-loc{margin:0;font-size:.82rem;font-weight:600;color:#6b7785}
.an-d .an-chips{margin-top:8px}
.an-d-av{margin-top:16px;padding:14px 16px 12px;border-radius:12px;background:#f4f9f8;border:1px solid #d7ebe8}
.an-d-av-l1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
.an-d-av-num{font-size:.86rem;font-weight:700;color:#4a5568}
.an-d-av-num b{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:1.55rem;font-weight:800;color:#1f2a35;margin-right:2px}
.an-d-av-pct{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:2rem;font-weight:800;color:#0b5e62;line-height:1;font-variant-numeric:tabular-nums}
.an-d-av .an-postes{height:22px;gap:3px}
.an-d-av .an-postes.cont{height:16px}
.an-cmp{width:100%;max-width:480px;border-collapse:collapse;margin-top:12px;font-size:.8rem}
.an-cmp th,.an-cmp td{padding:5px 0;border-top:1px solid #dcebe8;text-align:right;font-variant-numeric:tabular-nums}
.an-cmp th:first-child,.an-cmp td:first-child{text-align:left}
.an-cmp thead th{border-top:0;font-size:.72rem;font-weight:700;color:#6b7785;padding-top:0}
.an-cmp tbody th{font-weight:700;color:#4a5568}
.an-cmp td{font-weight:800;color:#1f2a35;padding-left:12px}
.an-cmp td.v{color:#a0aec0;font-weight:600}
.an-fatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;margin:14px 0 0;background:#e6edf0;border:1px solid #e6edf0;border-radius:12px;overflow:hidden}
.an-fato{background:#fff;padding:10px 13px;display:flex;flex-direction:column;gap:2px;margin:0}
.an-fato dt{font-size:.72rem;font-weight:700;color:#6b7785}
.an-fato dd{margin:0;font-size:.95rem;font-weight:800;color:#1f2a35}
.an-fato dd small{display:block;font-size:.74rem;font-weight:600;color:#6b7785;margin-top:1px}
.an-fato dd.al{color:#c53030}
.an-pessoas{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:.8rem;color:#6b7785;font-weight:600}
.an-pessoas b{color:#1f2a35;font-weight:800}
.an-d .m-acoes{margin-top:14px}
.an-d-sec{display:flex;align-items:center;gap:8px;margin:22px 0 12px;padding-top:16px;border-top:1px solid #edf2f7;font-size:.88rem;font-weight:800;color:#0b5e62}
.an-d-sec .ti{font-size:17px}

/* situação da obra */
.an-fase{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;padding:3px 9px 3px 8px;border-radius:6px;white-space:nowrap;border:1px solid}
.an-fase::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.an-fase.andamento{background:#ebf4ff;color:#2b6cb0;border-color:#bee3f8}
.an-fase.parada{background:#fff5f5;color:#c53030;border-color:#fed7d7}
.an-fase.nao_iniciada{background:#fffaf0;color:#975a16;border-color:#fbd38d}
.an-fase.concluida{background:#f0fff4;color:#276749;border-color:#c6f6d5}
.an-fase.cancelada{background:#f7fafc;color:#4a5568;border-color:#e2e8f0}
.an-fase.fora{background:#f7fafc;color:#4a5568;border-color:#a0aec0;border-style:dashed}
.an-fase.fora::before{background:transparent;border:1.5px solid currentColor;width:5px;height:5px}
.an-item.fora{border-left-style:dashed}
.m-alerta.an-info{background:#f7fafc;border:1px solid #e2e8f0;color:#4a5568}
.an-chips{display:flex;flex-wrap:wrap;gap:4px}
.an-chip{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;color:#4a5568;background:#f7fafc;border:1px solid #e2e8f0;border-radius:20px;padding:1px 8px 1px 6px;white-space:nowrap}
.an-chip i{width:7px;height:7px;border-radius:50%;background:var(--c,#a0aec0);flex-shrink:0}

/* linha do tempo: os dias da obra, do mais recente para o mais antigo */
.an-tl,.an-its{list-style:none;margin:0;padding:0}
.an-dia{position:relative;margin-left:6px;padding:0 0 14px 20px;border-left:2px solid #e2e8f0}
.an-dia:last-child{border-left-color:transparent;padding-bottom:0}
.an-dia::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:#14a085;border:2px solid #fff;box-shadow:0 0 0 1px #c0e8e5}
.an-dia.fut::before{background:#fff;box-shadow:0 0 0 2px #2b6cb0}
.an-dia.nada::before{background:#cbd5e0;box-shadow:0 0 0 1px #e2e8f0}
.an-dia-cab{display:flex;align-items:baseline;gap:8px;font-size:.8rem;font-weight:800;color:#1f2a35;margin-bottom:6px}
.an-dia-cab span{font-size:.72rem;font-weight:700;color:#7b8794}
.an-it{background:#fff;border:1px solid #e2e8f0;border-radius:9px;padding:8px 11px;margin-bottom:6px;font-size:.8rem;line-height:1.4}
.an-it:last-child{margin-bottom:0}
.an-it-l1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.an-it-l1 b{font-weight:800;color:#1f2a35}
.an-it-l2{color:#5f6b76;font-weight:600;margin-top:3px}
.an-src{font-size:.64rem;font-weight:800;padding:1px 6px;border-radius:4px;background:#eef6f5;color:#0b5e62}
.an-src.gpm{background:#eaf2fb;color:#2b6cb0}
.an-st{font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:5px;border:1px solid #e2e8f0;color:#718096;background:#f7fafc;white-space:nowrap}
.an-st.ok{color:#276749;background:#f0fff4;border-color:#c6f6d5}
.an-st.and{color:#2b6cb0;background:#ebf4ff;border-color:#bee3f8}
.an-st.nao{color:#c53030;background:#fff5f5;border-color:#fed7d7}
.an-st.av{color:#975a16;background:#fffaf0;border-color:#fbd38d}
.an-ats{display:flex;flex-direction:column;gap:2px;margin-top:5px;font-size:.76rem;color:#4a5568}
.an-ats li{display:flex;justify-content:space-between;gap:12px}
.an-ats li span:last-child{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}

/* celular e tablet em pé: a lista ocupa a tela e a obra abre por cima */
@media (max-width:900px){
  .an-split{grid-template-columns:1fr}
  .an-det{display:none}
  .an-det.aberto{display:block;position:fixed;inset:0;z-index:300;max-height:none;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .an-voltar{display:inline-flex;margin-bottom:14px}
  body.an-travado{overflow:hidden}
  .an-faixa{flex-wrap:wrap}
  .an-seg,.an-seg.todas,.an-seg.fora{flex:1 1 calc(50% - 4px)!important;min-width:0;min-height:60px;margin-left:0}
  .an-seg b{font-size:1.55rem}
  .an-grupo{top:calc(52px + env(safe-area-inset-top,0px))}
  .an-d{padding:16px 16px 28px}
}
@media (max-width:560px){
  .an-painel-tit b{font-size:2rem}
  .an-num{min-width:0;flex:1 1 40%}
}

/* tema escuro: o nav.js converte as cores; aqui só o que ele não acerta sozinho */
body.dark .an-seg.todas{background:#111!important;color:#f2f2f2!important;box-shadow:inset 0 0 0 1.5px #303030!important}
body.dark .an-seg[aria-pressed="true"]{outline-color:#f2f2f2!important}
body.dark .an-seg.fora{background:repeating-linear-gradient(135deg,#141414 0 8px,#1c1c1c 8px 16px)!important;color:#f2f2f2!important;box-shadow:inset 0 0 0 1.5px #4a4a4a!important}
body.dark .an-postes span{background:#2a2a2a!important}
body.dark .an-postes span.f{background:#14a085!important}
body.dark .an-postes.gpm span.f{background:#4299e1!important}
body.dark .an-postes.ok span.f{background:#48bb78!important}
body.dark .an-item[aria-current="true"]{background:#0e1d1c!important;box-shadow:inset 0 0 0 1.5px #14a085!important}

@media print{
  .an-filtros,.an-det,.an-abre,.an-mais,.an-lista-cab .m-select{display:none!important}
  .an-split{display:block}
  .an-grupo{position:static}
  .an-item-tit{-webkit-line-clamp:unset}
  .an-painel,.an-lista{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>

<div class="top-bar">

/* ============================================================================

   - Programação diária (turno_data.prog_diaria): cada frente com atividade,
     encarregado, quantidade prevista e realizada, valor pelo fator K e status.
   - Apontamento do GPM (turno_data.ocorr_fat_AAAA-MM, importado em Produção ou
     Ocorrências): serviços executados com as atividades e quantidades.
   - Quadro de Estágios (turno_data.estagios_board): etapa e pendências da obra.
   Só lê; não grava nada no banco.

   Situação de cada obra (regras em REGRAS, abaixo):
   - Concluída ........ status ENERGIZADA (ou concluída/finalizada) na carteira.
   - Cancelada ........ status CANCELADA ou RETIRADA DA CARTEIRA.
   - Parada ........... status PARALISADA, ou já teve atividade mas nenhuma nos
                        últimos REGRAS.diasParada dias e nada programado à frente.
   - Em andamento ..... atividade nos últimos REGRAS.diasParada dias ou frente
                        programada para hoje ou depois.
   - Não iniciada ..... nenhuma atividade registrada ainda.
   - Fora da carteira . PEP com atividade nos últimos REGRAS.diasForaCarteira dias (ou
                        frente programada) que não está na carteira. Aparece à parte, com o
                        que a programação e o GPM registraram, e não entra nas contas da carteira.
   Atividade = frente da programação com quantidade realizada (ou status
   EXECUTADO / EM EXECUÇÃO), ou serviço executado no GPM. É a mesma regra de
   "obra parada" do Painel do dia, que olha só a programação.
   ========================================================================== */
var AND_P = window.MariuaPainel || null;
var REGRAS = {
  diasParada: (AND_P && AND_P.REGRAS && AND_P.REGRAS.diasObraParada) || 5,  // mesmo número do Painel do dia
  diasForaCarteira: 60,    // obra fora da carteira com atividade neste período aparece em "Fora da carteira"
  // PEP de verdade é uma letra e sete números (B-1207032), comparado sem hífen, espaço e acento.
  // Lançamento com outra coisa no campo do PEP ("teste", "RENILSON-MANUT", "7804", "B-000001")
  // conta como sem PEP: não liga a obra nenhuma e não entra no aviso de obra fora da carteira.
  // O serviço continua valendo na produção e no faturamento da equipe.
  pepValido: /^[A-Z]\d{7}$/

function pepOk(k) { return REGRAS.pepValido.test(k); }
var CHAVES = ['obras_base', 'prog_diaria', 'estagios_board', 'usuario_contrato'];
var BASES = {
  JAC: { id: 'jac', nome: 'Jacobina',         uf: 'ba' },
  IRC: { id: 'irc', nome: 'Irecê',            uf: 'ba' },
  FSA: { id: 'fsa', nome: 'Feira de Santana', uf: 'ba' },
  SRR: { id: 'srr', nome: 'Serrinha',         uf: 'ba' },
  PA:  { id: 'pa',  nome: 'Congonhal',        uf: 'mg' },
  ITA: { id: 'ita', nome: 'Itajubá',          uf: 'mg' },
  AJU: { id: 'aju', nome: 'Aracaju',          uf: 'se' }
};
var ORDEM_BASES = ['JAC', 'IRC', 'FSA', 'SRR', 'PA', 'ITA', 'AJU'];
var FASES = {
  andamento:    { nome: 'Em andamento', abas: 'Em andamento', ordem: 0, cor: '#2b6cb0' },
  parada:       { nome: 'Parada',       abas: 'Paradas',      ordem: 1, cor: '#e53e3e' },
  nao_iniciada: { nome: 'Não iniciada', abas: 'Não iniciadas', ordem: 2, cor: '#d69e2e' },
  concluida:    { nome: 'Concluída',    abas: 'Concluídas',   ordem: 3, cor: '#38a169' },
  cancelada:    { nome: 'Cancelada',    abas: 'Canceladas',   ordem: 4, cor: '#a0aec0' }

var ORDEM_FASES = ['andamento', 'parada', 'nao_iniciada', 'concluida', 'cancelada'];

// ─── utilidades ─────────────────────────────────────────────────────────────
function norm(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase().replace(/\s+/g, ' ').trim();
}
function squash(s) { return norm(s).replace(/[^A-Z0-9]/g, ''); }
function parse(v) { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return v; } } return v; }
function p2(n) { return String(n).padStart(2, '0'); }
function zerar(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
function dataDe(s) {
  if (!s) return null;
  if (s instanceof Date) return isNaN(s) ? null : zerar(s);
  var t = String(s).trim(), m;
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return new Date(+m[1], +m[2] - 1, +m[3]);
  if ((m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return new Date(+m[3], +m[2] - 1, +m[1]);
  return null;
}
function iso(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function diasEntre(a, b) { return Math.round((zerar(b) - zerar(a)) / 86400000); }
function temValor(v) { var t = String(v == null ? '' : v).trim(); return t !== '' && !/^[-–—]$/.test(t); }
function num(v) {

  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else t = t.replace(',', '.');

  return isFinite(n) ? n : 0;
}
var MINUSC = { DA: 1, DE: 1, DO: 1, DAS: 1, DOS: 1, E: 1 };
function nomeProprio(s) {                    // 'LAPÃO' → 'Lapão', 'JOÃO DA SILVA' → 'João da Silva' (mantém os acentos)
  return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().split(' ').filter(Boolean).map(function (w, i) {
    var lw = w.toLocaleLowerCase('pt-BR');
    if (i > 0 && MINUSC[norm(w)]) return lw;
    return lw.charAt(0).toLocaleUpperCase('pt-BR') + lw.slice(1);
  }).join(' ');
}
function frase(s) { var t = String(s || '').trim().toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); }
var MESES_AB = { JAN: 1, FEV: 2, MAR: 3, ABR: 4, MAI: 5, JUN: 6, JUL: 7, AGO: 8, SET: 9, OUT: 10, NOV: 11, DEZ: 12 };
function ano4(a) { a = String(a); return a.length === 2 ? '20' + a : a; }
function mesDe(v) {                          // 'NOV/26', '11/2026', '15/11/2026', '2026-11' → '2026-11'
  var t = norm(v), m, ano, mes;
  if (!t) return '';
  if ((m = t.match(/(\d{4})-(\d{1,2})/))) { ano = m[1]; mes = +m[2]; }
  else if ((m = t.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) { ano = ano4(m[3]); mes = +m[2]; }
  else if ((m = t.match(/\b(\d{1,2})\/(\d{4})\b/))) { ano = m[2]; mes = +m[1]; }
  else if ((m = t.match(/\b(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)[A-Z]*\.?\s*[\/-]?\s*(\d{2,4})\b/))) { ano = ano4(m[2]); mes = MESES_AB[m[1]]; }

}
function baseDoTexto(t) {
  var n = norm(t);
  if (!n) return null;
  if (/JACOBINA|\bJAC\b/.test(n)) return BASES.JAC;
  if (/IRECE|\bIRC\b/.test(n)) return BASES.IRC;
  if (/SERRINHA|\bSRR\b/.test(n)) return BASES.SRR;
  if (/FEIRA|\bFSA\b/.test(n)) return BASES.FSA;
  if (/ARACAJU|\bAJU\b/.test(n)) return BASES.AJU;
  if (/ITAJUBA|\bITA\b/.test(n)) return BASES.ITA;
  if (/CONGONHAL|POUSO ALEGRE|\bPA\b/.test(n)) return BASES.PA;

}
// mesma classificação da tela Produção (cava, poste, cabo e condutor nu)
function classeGpm(desc, un) {
  var t = norm(desc), u = norm(un);
  if (/\bCAVA\b/.test(t)) return 'cava';
  if (/^POSTE (AT|BT)\b/.test(t) || /^(INSTALAR|IMPLANTAR) POSTE\b/.test(t)) return 'poste';
  if (/^INSTALAR CABO\b/.test(t) && (!u || u === 'M')) return 'cabo';
  if (/^INSTALAR CONDUTOR NU\b/.test(t)) return 'cond';
  return null;
}

// ─── leitura do banco ───────────────────────────────────────────────────────
// Lê com o login de quem está usando (window.MARIUA_SB). Se voltar vazio, tenta
// a chave pública, como o Painel do dia, e avisa: é sinal de RLS sem SELECT.
function lerAnonimo(sb, filtro) {
  var url = sb.supabaseUrl, key = sb.supabaseKey;
  if (!url || !key) return Promise.resolve([]);
  return fetch(url + '/rest/v1/turno_data?select=key,value,updated_at&' + filtro, {
    headers: { apikey: key, Authorization: 'Bearer ' + key }, cache: 'no-store'
  }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; });
}
function lerPrincipal() {
  var sb = window.MARIUA_SB;
  if (!sb) return Promise.reject(new Error('O login ainda não terminou.'));
  return sb.from('turno_data').select('key,value,updated_at').in('key', CHAVES).then(function (r) {
    if (r.error) throw new Error(r.error.message || 'Erro ao ler o banco.');
    if (r.data && r.data.length) return { linhas: r.data, viaAnonima: false };
    return lerAnonimo(sb, 'key=in.(' + CHAVES.join(',') + ')').then(function (l) {
      if (l.length) console.warn('[andamento] A leitura com o login voltou vazia e só funcionou com a chave pública. Libere SELECT no turno_data para usuários autenticados (RLS).');
      return { linhas: l, viaAnonima: l.length > 0 };
    });
  }).then(function (res) {
    var chaves = {};
    res.linhas.forEach(function (l) {
      chaves[l.key] = { valor: parse(l.value), atualizado: l.updated_at ? new Date(l.updated_at) : null };
    });
    return { chaves: chaves, viaAnonima: res.viaAnonima, em: new Date() };
  });
}
// O apontamento do GPM é a parte mais pesada (um registro por mês): vem depois,
// e a tela já abre com a carteira e a programação enquanto ele carrega.
function lerGpm() {
  var sb = window.MARIUA_SB;
  if (!sb) return Promise.reject(new Error('O login ainda não terminou.'));
  return sb.from('turno_data').select('key,value,updated_at').like('key', 'ocorr_fat_%').then(function (r) {
    if (r.error) throw new Error(r.error.message || 'Erro ao ler o apontamento.');
    if (r.data && r.data.length) return r.data;
    return lerAnonimo(sb, 'key=like.ocorr_fat_*');
  });
}

// ─── montagem ───────────────────────────────────────────────────────────────
function campos(o) {                         // chaves sem acento, espaço ou símbolo: 'POSTES  À IMPLANTA' → 'POSTESAIMPLANTA'
  var m = {};
  Object.keys(o || {}).forEach(function (k) {
    var sk = squash(k);
    if (!(sk in m) || (!temValor(m[sk]) && temValor(o[k]))) m[sk] = o[k];
  });
  return m;
}
function pega(m, nomes) { for (var i = 0; i < nomes.length; i++) { if (temValor(m[nomes[i]])) return m[nomes[i]]; } return ''; }

function mapaEstagios(B) {
  var out = { col: {}, tags: {}, n: 0 };
  if (!B || typeof B !== 'object') return out;
  var cols = {}, tipos = {};
  (B.columns || []).forEach(function (c) { if (c && c.key) cols[c.key] = c; });
  (B.pendencyTypes || []).forEach(function (t) { if (t && t.key) tipos[t.key] = t; });
  Object.keys(B.overrides || {}).forEach(function (k) {
    var c = cols[B.overrides[k]], sk = squash(k);
    if (c && sk && !/^ROW/.test(sk)) { out.col[sk] = { nome: frase(c.label), cor: c.color || '#a0aec0' }; out.n++; }
  });
  Object.keys(B.pendencyTags || {}).forEach(function (k) {
    var sk = squash(k);
    var l = (B.pendencyTags[k] || []).map(function (t) { return tipos[t]; }).filter(Boolean)
      .map(function (t) { return { nome: t.label, cor: t.color || '#a0aec0' }; });
    if (l.length && sk) out.tags[sk] = l;
  });
  return out;
}

function montarObras(OB, est) {
  var arr = (OB && Array.isArray(OB.data)) ? OB.data : (Array.isArray(OB) ? OB : []);
  var porId = {}, ordem = [];
  arr.forEach(function (o, idx) {
    if (!o || typeof o !== 'object') return;
    var f = campos(o);
    var pep = String(pega(f, ['PEPOBRA', 'PEP']) || '').trim();
    var titulo = String(pega(f, ['TITULO']) || '').trim();
    var mun = String(pega(f, ['MUNICIPIO']) || '').trim();
    if (!pep && !titulo) return;
    var id = squash(pep) || ('SP' + squash(titulo + mun));
    var c = { f: f, mes: mesDe(pega(f, ['MES', 'MESPREVISTO', 'DATADELANCAMENTO'])), idx: idx };
    if (!porId[id]) { porId[id] = []; ordem.push(id); }
    porId[id].push(c);
  });
  // A carteira do banco soma vários meses: a mesma obra pode vir repetida.
  // Fica a linha do mês mais recente, completada com o que só as outras têm.
  return ordem.map(function (id) {
    var cs = porId[id].slice().sort(function (a, b) { return (a.mes < b.mes ? -1 : a.mes > b.mes ? 1 : 0) || (a.idx - b.idx); });
    var f = {};
    cs.forEach(function (c) { Object.keys(c.f).forEach(function (k) { if (temValor(c.f[k])) f[k] = c.f[k]; }); });
    var pep = String(pega(f, ['PEPOBRA', 'PEP']) || '').trim();
    var statusTxt = String(pega(f, ['STATUSDAOBRA', 'STATUS', 'OBSSTATUS']) || '').trim();
    var utd = String(pega(f, ['UTD', 'BASE']) || '').trim();
    var mes = '';
    cs.forEach(function (c) { if (c.mes > mes) mes = c.mes; });
    return {
      id: id, pep: pep, pepK: squash(pep), semPep: !pep,
      titulo: String(pega(f, ['TITULO']) || '').trim(),
      mun: String(pega(f, ['MUNICIPIO']) || '').trim(),
      utd: utd, base: baseDoTexto(utd),
      statusTxt: statusTxt, status: norm(statusTxt),
      encCart: String(pega(f, ['ENCARREGADO']) || '').trim(),
      mes: mes,
      postesPrev: num(pega(f, ['POSTESPREVISTOS', 'POSTESPREVISTO'])),
      postesReal: num(pega(f, ['POSTESREALIZADO', 'POSTESREALIZADOS'])),
      temPostesReal: temValor(pega(f, ['POSTESREALIZADO', 'POSTESREALIZADOS'])),
      postesImp: num(pega(f, ['POSTESAIMPLANTA', 'POSTESAIMPLANTAR'])),
      temPostesImp: temValor(pega(f, ['POSTESAIMPLANTA', 'POSTESAIMPLANTAR'])),
      cavas: num(pega(f, ['CAVAREALIZADA', 'CAVASREALIZADAS'])),
      temCavas: temValor(pega(f, ['CAVAREALIZADA', 'CAVASREALIZADAS'])),

}

function indexarProg(P) {
  var regs = Array.isArray(P) ? P : ((P && Array.isArray(P.registros)) ? P.registros : []);
  var por = {}, n = 0, ignorados = {};
  regs.forEach(function (r) {
    if (!r || typeof r !== 'object') return;
    var k = squash(r.pep);
    if (!k || k === 'SEMOBRA') return;
    if (!pepOk(k)) { ignorados[String(r.pep).trim()] = 1; return; }
    var d = dataDe(r.data);
    if (!d) return;
    var st = norm(r.status);
    var x = {
      d: d, iso: iso(d), enc: r.encarregado || '', sup: r.supervisor || '', atv: r.atividade || '', tipo: r.tipo || '',
      qPrev: num(r.qtd_previsto), qReal: num(r.qtd_realizado), vPrev: num(r.valor_previsto), vReal: num(r.valor_realizado),
      st: st, stTxt: r.status || '', turno: r.turno || '', colab: num(r.qtd_colab),
      obra: r.nome_obra || '', mun: r.municipio || '', pep: String(r.pep || '').trim()
    };
    x.prod = x.qReal > 0 || st === 'EXECUTADO' || st === 'EM EXECUCAO';
    (por[k] = por[k] || []).push(x);
    n++;
  });
  return { por: por, n: n, ignorados: Object.keys(ignorados) };
}

function indexarGpm(linhas) {
  var por = {}, n = 0, semPep = 0, comCampo = false, meses = [], atual = null, ignorados = {};
  (linhas || []).forEach(function (l) {
    var v = parse(l.value);
    if (!v || !Array.isArray(v.servs)) return;
    meses.push(String(v.comp || String(l.key).slice(10)));
    var at = l.updated_at ? new Date(l.updated_at) : (v.atualizado ? new Date(v.atualizado) : null);
    if (at && !isNaN(at) && (!atual || at > atual)) atual = at;
    v.servs.forEach(function (s) {
      if (!s) return;
      if (Object.prototype.hasOwnProperty.call(s, 'pep')) comCampo = true;
      var k = squash(s.pep);
      if (!k) { semPep++; return; }
      if (!pepOk(k)) { ignorados[String(s.pep).trim()] = 1; semPep++; return; }
      var d = dataDe(s.d);
      if (!d) return;
      var ret = norm(s.ret), exec = !ret || ret.indexOf('EXECUTADO') === 0;
      var x = { d: d, iso: iso(d), s: String(s.s || ''), eq: String(s.eq || '').toUpperCase().trim(), resp: s.resp || '', cs: s.cs || '', sup: s.sup || '',
                ret: s.ret || '', exec: exec, obra: s.obra || '', pep: String(s.pep || '').trim(), at: [],
                cava: 0, poste: 0, cabo: 0, cond: 0 };
      (s.at || []).forEach(function (a) {
        if (!Array.isArray(a)) return;
        var q = num(a[3]);
        x.at.push({ cod: a[0] || '', desc: String(a[1] || '').trim(), un: String(a[2] || '').trim(), q: q });
        if (!exec || !(q > 0)) return;
        var c = classeGpm(a[1], a[2]);
        if (c) x[c] += q;
      });
      (por[k] = por[k] || []).push(x);
      n++;
    });
  });
  return { por: por, n: n, semPep: semPep, comCampo: comCampo, meses: meses.sort(), atualizado: atual, ignorados: Object.keys(ignorados) };
}

function porData(a, b) { return a.d - b.d; }

function calcular(o, regs, servs, hoje) {
  o.prog = (regs || []).slice().sort(porData);
  o.gpm = (servs || []).slice().sort(porData);
  var mesAtual = iso(hoje).slice(0, 7);
  var dias = {}, frentes = 0, vPrev = 0, vReal = 0, vMes = 0, qPrev = 0, qReal = 0;
  var ultima = null, proxima = null, primeira = null, sup = '', encUlt = '', encs = {};
  o.prog.forEach(function (x) {
    if (x.d <= hoje) {
      frentes++; vPrev += x.vPrev; vReal += x.vReal; qPrev += x.qPrev; qReal += x.qReal;
      if (x.iso.slice(0, 7) === mesAtual) vMes += x.vReal;
      if (x.prod) {
        dias[x.iso] = 1;
        if (!primeira || x.d < primeira) primeira = x.d;
        if (!ultima || x.d >= ultima.d) ultima = { d: x.d, quem: nomeProprio(x.enc), oque: x.atv, fonte: 'prog' };
      }
    }
    // programado para hoje e ainda sem resultado, ou para depois: é a próxima frente
    if (x.d > hoje || (+x.d === +hoje && !x.prod)) {
      if (!proxima || x.d < proxima.d) proxima = { d: x.d, quem: nomeProprio(x.enc), oque: x.atv, n: 1 };
      else if (+x.d === +proxima.d) proxima.n++;
    }
    if (x.sup && x.d <= hoje) sup = x.sup;
    if (x.enc) { encs[nomeProprio(x.enc)] = 1; if (x.d <= hoje) encUlt = x.enc; }
  });
  var g = { servs: 0, poste: 0, cava: 0, cabo: 0, cond: 0, eqs: {} };
  o.gpm.forEach(function (s) {
    if (!s.exec || s.d > hoje) return;
    g.servs++; g.poste += s.poste; g.cava += s.cava; g.cabo += s.cabo; g.cond += s.cond;
    if (s.eq) g.eqs[s.eq] = 1;
    dias[s.iso] = 1;
    if (!primeira || s.d < primeira) primeira = s.d;
    if (!ultima || s.d > ultima.d) ultima = { d: s.d, quem: s.resp ? nomeProprio(s.resp) : s.eq, oque: s.at.length ? s.at[0].desc : 'Serviço ' + s.s, fonte: 'gpm' };
  });
  if (!sup && o.prog.length) sup = o.prog[o.prog.length - 1].sup || '';
  if (!sup) o.gpm.forEach(function (s) { if (s.sup && s.d <= hoje) sup = s.sup; });
  o.nDias = Object.keys(dias).length;
  o.frentes = frentes; o.vPrev = vPrev; o.vReal = vReal; o.vMes = vMes; o.qPrev = qPrev; o.qReal = qReal;
  o.primeira = primeira; o.ultima = ultima; o.proxima = proxima;
  o.sup = sup ? nomeProprio(sup) : '';
  o.enc = o.encCart ? nomeProprio(o.encCart) : (encUlt ? nomeProprio(encUlt) : '');
  o.encs = Object.keys(encs);
  o.g = g;
  o.diasSem = ultima ? diasEntre(ultima.d, hoje) : null;

  // avanço físico: postes realizados ÷ previstos (carteira); sem realizado na
  // carteira, usa os postes executados no GPM
  var total = o.postesPrev > 0 ? o.postesPrev : ((o.temPostesImp || o.temPostesReal) ? o.postesReal + o.postesImp : 0);
  var av = { total: total, real: 0, pct: null, fonte: '' };
  if (total > 0) {

function itemLista(o) {

if (largo.addEventListener) largo.addEventListener('change', function () { if (largo.matches) fecharDetalhe(); if (dados) desenhar(); });

  }

  function cel(v, un) { return v ? '<td>' + nfmt(v, 1) + (un ? ' ' + un : '') + '</td>' : '<td class="v">—</td>'; }

function stProg(x, aindaNao) {
  switch (x.st) {
    case 'EXECUTADO': return ['ok', 'Executado'];
    case 'EM EXECUCAO': return ['and', 'Em execução'];
    case 'NAO EXECUTADO': return ['nao', 'Não executado'];
    case 'CHUVA': return ['av', 'Chuva'];
    case 'SEM ACESSO': return ['av', 'Sem acesso'];
    case '': return aindaNao ? ['and', 'Programado'] : (x.qReal > 0 ? ['ok', 'Realizado'] : ['', 'Sem resultado']);
  }
  return ['', frase(x.stTxt)];
}
function itemProg(x, aindaNao) {
  var s = stProg(x, aindaNao), l2 = [];
  if (x.enc) l2.push(nomeProprio(x.enc));
  if (x.qPrev || x.qReal) {
    l2.push('Previsto ' + nfmt(x.qPrev, 2) + (aindaNao && !x.qReal ? '' : ', realizado ' + nfmt(x.qReal, 2) +
      (x.qPrev > 0 ? ' (' + pctTxt(x.qReal / x.qPrev) + ')' : '')));
  }
  if (x.vReal >= 1) l2.push(UI.moeda(x.vReal) + ' pelo fator K');
  else if (aindaNao && x.vPrev >= 1) l2.push(UI.moeda(x.vPrev) + ' previstos');
  if (x.colab > 0) l2.push(pl(x.colab, 'colaborador', 'colaboradores'));
  return '<li class="an-it"><div class="an-it-l1"><span class="an-src">Programação</span><b>' + esc(x.atv || 'Atividade sem nome') + '</b>' +
    '<span class="an-st ' + s[0] + '">' + esc(s[1]) + '</span></div>' +
    (l2.length ? '<div class="an-it-l2">' + esc(l2.join('. ')) + '.</div>' : '') + '</li>';
}
function itemGpm(s) {
  var l2 = [], q = [];
  if (s.eq) l2.push(s.eq + (s.resp ? ', ' + nomeProprio(s.resp) : ''));
  if (s.poste) q.push(pl(s.poste, 'poste', 'postes'));
  if (s.cava) q.push(pl(s.cava, 'cava', 'cavas'));
  if (s.cabo) q.push(nfmt(s.cabo, 1) + ' m de cabo');
  if (q.length) l2.push(frase(q.join(', ')));
  var ats = s.at.slice(0, 6).map(function (a) {
    return '<li><span>' + esc(a.desc || a.cod || 'Atividade') + '</span><span>' + nfmt(a.q, 2) + (a.un ? ' ' + esc(a.un.toLowerCase()) : '') + '</span></li>';
  }).join('');
  if (s.at.length > 6) ats += '<li><span class="m-meta">e mais ' + pl(s.at.length - 6, 'atividade', 'atividades') + '</span><span></span></li>';
  return '<li class="an-it"><div class="an-it-l1"><span class="an-src gpm">GPM</span><b>Serviço ' + esc(s.s) + '</b>' +
    '<span class="an-st ' + (s.exec ? 'ok' : 'nao') + '">' + esc(s.exec ? 'Executado' : (frase(s.ret) || 'Não executado')) + '</span></div>' +
    (l2.length ? '<div class="an-it-l2">' + esc(l2.join('. ')) + '.</div>' : '') +
    (ats ? '<ul class="an-ats">' + ats + '</ul>' : '') + '</li>';
}
function linhaDoTempo(o) {
  var dias = {};
  function dia(x) { return dias[x.iso] || (dias[x.iso] = { d: x.d, prog: [], gpm: [] }); }
  o.prog.forEach(function (x) { dia(x).prog.push(x); });
  o.gpm.forEach(function (s) { dia(s).gpm.push(s); });
  var chaves = Object.keys(dias).sort().reverse();
  if (!chaves.length) {
    return '<p class="m-meta" style="line-height:1.5">' + (o.semPep
      ? 'Esta obra está sem PEP na carteira, por isso não se liga à programação nem ao apontamento do GPM. Preencha o PEP na planilha da carteira e sincronize no Mapa.'
      : 'Nenhuma frente programada nem serviço apontado no GPM para o PEP ' + esc(o.pep) + '.') + '</p>';
  }
  var tudo = !!estado.tlTudo[o.id], mostrar = tudo ? chaves : chaves.slice(0, DIAS_TL), hoje = dados.hoje;
  var h = '<ol class="an-tl">' + mostrar.map(function (k) {
    var D = dias[k], fut = D.d > hoje, ehHoje = +D.d === +hoje;
    var feito = D.prog.some(function (x) { return x.prod; }) || D.gpm.some(function (s) { return s.exec; });
    var cls = (fut || (ehHoje && !feito)) ? ' fut' : (!feito ? ' nada' : '');
    var quando = fut ? 'programado, ' + rel(D.d) : (ehHoje ? 'hoje' : rel(D.d));
    return '<li class="an-dia' + cls + '"><div class="an-dia-cab">' + DSEM[D.d.getDay()] + ', ' + br(D.d) + '<span>' + quando + '</span></div>' +
      '<ul class="an-its">' + D.prog.map(function (x) { return itemProg(x, fut || (ehHoje && !x.prod)); }).join('') +
      D.gpm.map(itemGpm).join('') + '</ul></li>';
  }).join('') + '</ol>';
  if (mostrar.length < chaves.length) {
    var resto = chaves.length - mostrar.length;
    h += '<button type="button" class="m-bt m-bt-peq" data-tl="' + esc(o.id) + '" style="margin-top:12px">' +
      (resto === 1 ? 'Mostrar o dia anterior' : 'Mostrar os ' + nfmt(resto) + ' dias anteriores') + '</button>';
  }
  return h;
}
function resumoObra(o) {
  var l = ['*' + (o.pep ? 'Obra ' + o.pep : 'Obra sem PEP') + '*' + (o.titulo ? ' - ' + o.titulo : '')];
  var loc = local(o);
  if (loc) l.push(loc);
  l.push(o.foraCarteira ? 'Situação: fora da carteira (sem status)' : 'Situação: ' + FASES[o.fase].nome + (o.statusTxt ? ' (carteira: ' + frase(o.statusTxt) + ')' : ''));
  if (o.estagio || o.pend.length) {
    l.push((o.estagio ? 'Estágio: ' + o.estagio.nome : 'Pendências') +
      (o.pend.length ? (o.estagio ? ', pendências: ' : ': ') + o.pend.map(function (p) { return p.nome; }).join(', ') : ''));
  }
  if (o.av.pct != null && o.av.fonte !== 'status') {
    l.push('Avanço: ' + nfmt(Math.round(o.av.real)) + ' de ' + nfmt(Math.round(o.av.total)) + ' postes (' + pctTxt(o.av.pct) + ')' + (o.av.fonte === 'gpm' ? ', pelo GPM' : ''));
  }
  if (o.nDias) l.push('Dias com atividade: ' + o.nDias + (o.vReal > 0 ? '. Executado: ' + UI.moeda(o.vReal) : ''));
  if (o.ultima) l.push('Última atividade: ' + br(o.ultima.d) + ' (' + rel(o.ultima.d) + ')' + (o.ultima.quem ? ' com ' + o.ultima.quem : '') + (o.ultima.oque ? ', ' + o.ultima.oque : ''));
  l.push(o.proxima ? 'Próxima frente: ' + (+o.proxima.d === +dados.hoje ? 'hoje' : br(o.proxima.d)) + (o.proxima.quem ? ' com ' + o.proxima.quem : '') + (o.proxima.oque ? ', ' + o.proxima.oque : '') : 'Próxima frente: nada programado');
  return l.join('\n');
}

// ─── regras, avisos e fontes ────────────────────────────────────────────────
function desenharRegras() {
  var d = REGRAS.diasParada;
  $('regras').innerHTML = '<dl class="an-regras">' +
    '<dt><span class="an-fase andamento">Em andamento</span></dt><dd>Teve atividade nos últimos ' + d + ' dias ou tem frente programada para hoje ou depois.</dd>' +
    '<dt><span class="an-fase parada">Parada</span></dt><dd>Já teve atividade, mas nenhuma há ' + d + ' dias ou mais e nada programado. Também entra a obra PARALISADA na carteira.</dd>' +
    '<dt><span class="an-fase nao_iniciada">Não iniciada</span></dt><dd>Nenhuma atividade registrada ainda, mesmo que já tenha frente programada.</dd>' +
    '<dt><span class="an-fase concluida">Concluída</span></dt><dd>ENERGIZADA na carteira.</dd>' +
    '<dt><span class="an-fase fora">Fora da carteira</span></dt><dd>Teve atividade nos últimos ' + REGRAS.diasForaCarteira + ' dias, ou tem frente programada, mas o PEP não está na carteira sincronizada no Mapa. Aparece à parte, sem status nem postes previstos, e não entra nas contas da carteira.</dd>' +
    '</dl><p class="m-meta" style="margin-top:12px;line-height:1.5">Atividade é uma frente da programação com quantidade realizada (ou status Executado ou Em execução), ou um serviço executado no GPM. ' +
    'O avanço é postes realizados ÷ postes previstos da carteira; quando a carteira não traz o realizado, usa os postes executados no GPM.</p>';
}
function desenharAvisos() {
  var F = dados.fontes, hoje = dados.hoje, l = [];
  function aviso(ic, txt) { l.push('<div class="m-alerta atencao"><i class="ti ti-' + ic + '" aria-hidden="true"></i><span>' + txt + '</span></div>'); }
  var c = F.carteira, lim = (AND_P && AND_P.REGRAS.diasCarteiraVelha) || 7;
  if (c.atualizado && diasEntre(c.atualizado, hoje) >= lim) aviso('alert-triangle', 'A carteira não é sincronizada há ' + diasEntre(c.atualizado, hoje) + ' dias. Status e postes podem estar desatualizados.');
  var nf = dados.obras.filter(function (o) { return o.foraCarteira; }).length;
  if (nf && estado.aba !== 'fora') {
    l.push('<div class="m-alerta atencao"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span>' + pl(nf, 'obra teve', 'obras tiveram') + ' atividade nos últimos ' + REGRAS.diasForaCarteira +
      ' dias e não ' + (nf === 1 ? 'está' : 'estão') + ' na carteira sincronizada no Mapa. ' + (nf === 1 ? 'Ela aparece' : 'Elas aparecem') + ' em Fora da carteira, com o que a programação e o GPM registraram.</span>' +
      '<button type="button" class="m-bt m-bt-peq" data-ver-fora="1" style="margin-left:auto">Ver ' + (nf === 1 ? 'a obra' : 'as obras') + '</button></div>');
  } else if (nf) {
    l.push('<div class="m-alerta an-info"><i class="ti ti-info-circle" aria-hidden="true"></i><span>Obras com atividade nos últimos ' + REGRAS.diasForaCarteira + ' dias que não estão na carteira. Sem a carteira, a tela não tem status nem postes previstos delas. Para acompanhar o avanço, inclua a obra na planilha da carteira e sincronize no Mapa.</span></div>');
  }
  if (gpmEstado === 'erro' && !gpmLinhas) aviso('plug-connected-x', 'O apontamento do GPM não carregou' + (gpmErro ? ' (' + esc(gpmErro) + ')' : '') + '. A tela mostra só a carteira e a programação.');
  $('avisos').innerHTML = l.join('');
}
$('avisos').addEventListener('click', function (e) {
  if (!e.target.closest('[data-ver-fora]')) return;
  estado.aba = 'fora'; estado.todas = false; guardar(); desenhar();
});
function desenharFontes() {
  var F = dados.fontes, hoje = dados.hoje;
  function linha(nome, tela, texto, st) {
    var cor = { ok: '#276749', velha: '#b7791f', ausente: '#a0aec0', lendo: '#7b8794' }[st] || '#276749';
    var n = UI.pode(tela) ? '<a class="m-link" href="' + esc(tela) + '">' + esc(nome) + '</a>' : '<span class="m-tit">' + esc(nome) + '</span>';
    return '<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:.82rem;border-bottom:1px solid #edf2f7">' + n +
      '<span style="color:' + cor + ';text-align:right;font-weight:800">' + esc(texto) + '</span></div>';
  }
  function quando(d) { return d ? UI.relativo(d) : 'sem data'; }
  var h = '';
  var c = F.carteira, velha = c.atualizado && diasEntre(c.atualizado, hoje) >= ((AND_P && AND_P.REGRAS.diasCarteiraVelha) || 7);
  h += linha('Carteira de obras', 'mapa.html', c.existe ? pl(c.n, 'obra', 'obras') + ', ' + quando(c.atualizado) : 'não encontrada', !c.existe ? 'ausente' : velha ? 'velha' : 'ok');
  h += linha('Programação', 'prog.html', F.prog.existe ? pl(F.prog.n, 'frente com PEP', 'frentes com PEP') + ', ' + quando(F.prog.atualizado) : 'não encontrada', F.prog.existe ? 'ok' : 'ausente');
  h += linha('Estágios', 'estagios.html', F.estagios.existe ? pl(F.estagios.n, 'obra com estágio', 'obras com estágio') : 'não encontrado', F.estagios.existe ? 'ok' : 'ausente');
  var g = F.gpm, gt, gs;
  if (!g.carregado) { gt = gpmEstado === 'erro' ? 'não carregou' : 'carregando…'; gs = gpmEstado === 'erro' ? 'ausente' : 'lendo'; }
  else if (!g.meses.length) { gt = 'nenhum mês importado'; gs = 'ausente'; }
  else if (!g.comCampo) { gt = 'os arquivos não trazem o PEP'; gs = 'velha'; }
  else { gt = pl(g.n, 'serviço com PEP', 'serviços com PEP') + ', ' + mesTxt(g.meses[0]) + (g.meses.length > 1 ? ' a ' + mesTxt(g.meses[g.meses.length - 1]) : ''); gs = 'ok'; }
  h += linha('Apontamento do GPM', 'producao.html', gt, gs);
  if (g.carregado && g.comCampo && g.semPep) h += '<p class="m-meta" style="margin-top:8px">' + pl(g.semPep, 'serviço do GPM sem PEP ficou', 'serviços do GPM sem PEP ficaram') + ' de fora (manutenção ou obra sem PEP no GPM).</p>';
  if (dados.ignorados.length) h += '<p class="m-meta" style="margin-top:8px">' + pl(dados.ignorados.length, 'PEP fora do padrão foi tratado', 'PEPs fora do padrão foram tratados') + ' como sem PEP e não liga' + (dados.ignorados.length === 1 ? '' : 'm') + ' a obra nenhuma: ' + esc(dados.ignorados.slice(0, 6).join(', ')) + (dados.ignorados.length > 6 ? ' e mais ' + (dados.ignorados.length - 6) : '') + '.</p>';
  h += dados.viaAnonima
    ? '<div class="m-alerta atencao" style="margin-top:12px"><i class="ti ti-lock-open" aria-hidden="true"></i><span>A leitura só funcionou com a chave pública. Peça ao administrador para liberar a leitura com login no banco (RLS).</span></div>'
    : '<p class="m-meta" style="margin-top:10px">Lido com o seu login. Esta tela só lê; nada é alterado no banco.</p>';
  $('fontes').innerHTML = h;
}

// ─── planilha ───────────────────────────────────────────────────────────────
function exportar() {
  if (!dados) return;
  var lista = listaAtual();
  if (!lista.length) { UI.toast('Nenhuma obra na lista para baixar.'); return; }
  var SEP = ';';
  function n(v, dec) { return (v === null || v === undefined || v === '') ? '' : Number(v).toFixed(dec || 0).replace('.', ','); }
  function d(x) { return x ? p2(x.getDate()) + '/' + p2(x.getMonth() + 1) + '/' + x.getFullYear() : ''; }
  var cols = ['PEP', 'TITULO', 'MUNICIPIO', 'BASE', 'ORIGEM', 'STATUS_CARTEIRA', 'SITUACAO', 'ESTAGIO', 'PENDENCIAS', 'POSTES_PREVISTOS', 'POSTES_REALIZADOS',
    'POSTES_A_IMPLANTAR', 'AVANCO_%', 'FONTE_AVANCO', 'CAVAS_REALIZADAS', 'DIAS_COM_ATIVIDADE', 'FRENTES', 'VALOR_PREVISTO', 'VALOR_REALIZADO',
    'PRIMEIRA_ATIVIDADE', 'ULTIMA_ATIVIDADE', 'DIAS_SEM_ATIVIDADE', 'ULTIMA_QUEM', 'PROXIMA_FRENTE', 'PROXIMA_QUEM', 'ENCARREGADO', 'SUPERVISOR',
    'GPM_SERVICOS', 'GPM_POSTES', 'GPM_CAVAS', 'GPM_CABO_M'];
  var linhas = lista.map(function (o) {
    return [o.pep, o.titulo, nomeProprio(o.mun), nomeBase(o), o.foraCarteira ? 'Fora da carteira' : 'Carteira', o.statusTxt, o.foraCarteira ? '' : FASES[o.fase].nome, o.estagio ? o.estagio.nome : '',
      o.pend.map(function (p) { return p.nome; }).join(', '), o.postesPrev || '', o.temPostesReal ? o.postesReal : '', o.temPostesImp ? o.postesImp : '',
      (o.av.pct != null && o.av.fonte !== 'status') ? n(o.av.pct * 100, 1) : '', o.av.fonte === 'status' ? '' : o.av.fonte,
      o.temCavas ? o.cavas : '', o.nDias, o.frentes, n(o.vPrev, 2), n(o.vReal, 2), d(o.primeira), o.ultima ? d(o.ultima.d) : '',
      o.diasSem == null ? '' : o.diasSem, o.ultima ? o.ultima.quem : '', o.proxima ? d(o.proxima.d) : '', o.proxima ? o.proxima.quem : '',
      o.enc, o.sup, gpmLinhas ? o.g.servs : '', gpmLinhas ? n(o.g.poste, 1) : '', gpmLinhas ? n(o.g.cava, 1) : '', gpmLinhas ? n(o.g.cabo, 1) : ''
    ].map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(SEP);
  });
  var csv = ['sep=' + SEP, cols.join(SEP)].concat(linhas).join('\r\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'andamento-obras-' + iso(dados.hoje) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  UI.toast(pl(lista.length, 'obra baixada', 'obras baixadas') + ' em planilha.');
}

// ─── leitura e desenho ──────────────────────────────────────────────────────
function remontar() {
  dados = montar(bruto, gpmLinhas, estadosUsuario);
  var abrir = false;
  if (pepPedido) {                      // andamento.html?pep=XXXX abre direto a obra
    var k = squash(pepPedido), o = dados.obras.filter(function (x) { return x.pepK === k; })[0];
    if (o) {
      estado.q = o.pep; $('f-q').value = o.pep; estado.base = estado.status = estado.sup = '';
      estado.aba = o.foraCarteira ? 'fora' : 'todas'; estado.sel = o.id; abrir = true;
    }
    pepPedido = '';
  }
  desenhar();
  if (abrir) escolher(estado.sel, true);
}
function desenhar() {
  if (!dados) return;
  desenharFiltros();
  var base = filtradas(), c = contar(base);
  if (estado.aba !== 'todas' && estado.aba !== 'fora' && !FASES[estado.aba]) estado.aba = 'todas';
  if ((estado.aba === 'cancelada' && !c.cancelada) || (estado.aba === 'fora' && !c.fora)) estado.aba = 'todas';
  desenharPainel(base, c);
  desenharAvisos();
  var lista = desenharLista(base);
  // no computador, sempre há uma obra aberta: a escolhida, se ainda está na lista, ou a primeira
  var naLista = lista.some(function (o) { return o.id === estado.sel; });
  if (largo.matches && !naLista) { estado.sel = lista.length ? lista[0].id : ''; marcarSelecionada(); }
  var det = $('detalhe'), st = det.scrollTop;
  desenharDetalhe();
  det.scrollTop = st;
  desenharRegras();
  desenharFontes();
  $('atualizado').textContent = 'Leitura às ' + UI.hora(new Date(ultimaLeitura)) + (gpmEstado === 'carregando' && !gpmLinhas ? '. Carregando o apontamento do GPM…' : '') + '. A tela atualiza sozinha a cada 10 minutos.';
}
function atualizar(manual) {
  if (lendo) return Promise.resolve();
  lendo = true;
  UI.sinc('lendo', 'Atualizando…');
  $('bt-atualizar').disabled = true;
  return lerPrincipal().then(function (b) {
    bruto = b; ultimaLeitura = Date.now();
    estadosUsuario = (AND_P && AND_P.estadosDoUsuario) ? AND_P.estadosDoUsuario(b, window.MARIUA_USER) : null;
    if (!gpmLinhas) gpmEstado = 'carregando';
    remontar();
    UI.sinc('ok', 'Banco online · ' + UI.hora(b.em));
    return lerGpm().then(function (l) { gpmLinhas = l || []; gpmEstado = 'ok'; gpmErro = ''; },
      function (err) { console.error('[andamento] GPM', err); gpmErro = err.message || String(err); gpmEstado = gpmLinhas ? 'ok' : 'erro'; })
      .then(function () { remontar(); if (manual) UI.toast('Obras atualizadas'); });
  }).catch(function (err) {
    console.error('[andamento]', err);
    UI.sinc('erro', 'Sem conexão');
    if (!dados) {
      $('lista').innerHTML = '<div class="m-erro"><i class="ti ti-plug-connected-x" aria-hidden="true"></i><span>Não foi possível ler o banco: ' + esc(err.message || err) + '</span>' +
        '<button type="button" class="m-bt m-bt-peq" onclick="window.andamentoAtualizar(true)">Tentar de novo</button></div>';
      $('faixa').innerHTML = '<span class="m-stat-erro">Sem dados enquanto o banco não responder.</span>';
      $('numeros').innerHTML = '';
    } else UI.toast('Não foi possível atualizar. Mostrando a última leitura.');
  }).then(function () { lendo = false; $('bt-atualizar').disabled = false; });
}
window.andamentoAtualizar = atualizar;

$('bt-atualizar').addEventListener('click', function () { atualizar(true); });
$('bt-exportar').addEventListener('click', exportar);
$('bt-imprimir').addEventListener('click', function () { window.print(); });

UI.esperarLogin().then(function () {
  atualizar(false);
  setInterval(function () { if (!document.hidden) atualizar(false); }, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - ultimaLeitura > 10 * 60 * 1000) atualizar(false);
  });
});

})();
</script>
</body>
