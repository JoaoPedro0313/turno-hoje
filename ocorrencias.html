<style id="sidemenu-css">
.page-nav{display:none !important;}
body{padding-top:60px !important;padding-left:232px;}
.sm-side{position:fixed;top:52px;left:0;bottom:0;width:232px;z-index:110;background:#fff;border-right:1px solid #e6ebee;box-shadow:2px 0 12px rgba(0,0,0,.04);display:flex;flex-direction:column;transition:width .22s ease;font-family:'Barlow',sans-serif}
.sm-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #eef2f4;overflow:hidden}
.sm-logo{width:34px;height:34px;flex-shrink:0;object-fit:contain;display:block}
.sm-logo-tx{font-weight:800;color:#0d7377;letter-spacing:1px;font-size:1rem;white-space:nowrap;line-height:1.05}
.sm-logo-tx small{display:block;font-size:.5rem;letter-spacing:2px;color:#9aa6ab;font-weight:700}
.sm-toggle{display:flex;justify-content:center;padding:7px 0;border-bottom:1px solid #eef2f4}
.sm-toggle button{background:#f3f6f7;border:1px solid #e6ebee;color:#0d7377;width:38px;height:30px;border-radius:8px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.sm-toggle button:hover{background:#e7f0f0}
.sm-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-direction:column;gap:3px}
.sm-item{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:10px;text-decoration:none;color:#54616a;transition:background .14s,color .14s;white-space:nowrap;cursor:pointer}
.sm-item:hover{background:#eef4f4;color:#0d7377}
.sm-ic{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#f1f5f6}
.sm-tx{font-size:.84rem;font-weight:700}
.sm-item.active{background:linear-gradient(135deg,#0d7377,#14a085);color:#fff;box-shadow:0 4px 12px rgba(13,115,119,.28)}
.sm-item.active .sm-ic{background:rgba(255,255,255,.22)}
.sm-foot{padding:9px 14px;border-top:1px solid #eef2f4;font-size:.6rem;color:#aab4b8;font-weight:700;white-space:nowrap;overflow:hidden}.sm-group{display:flex;flex-direction:column}
.sm-group-head{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:10px;cursor:pointer;color:#54616a;transition:background .14s,color .14s;white-space:nowrap;user-select:none}
.sm-group-head:hover{background:#eef4f4;color:#0d7377}
.sm-group-head .sm-tx{flex:1}
.sm-arrow{font-size:.7rem;color:#b8c2c6;transition:transform .18s;margin-left:auto}
.sm-group.open .sm-arrow{transform:rotate(90deg)}
.sm-group-items{display:none;flex-direction:column;gap:2px;padding:2px 0 4px 12px;margin-left:9px;border-left:1.5px solid #eef2f4}
.sm-group.open .sm-group-items{display:flex}
.sm-sub{padding:7px 11px}
.sm-sub .sm-ic{font-size:.95rem}
body.sm-collapsed .sm-arrow{display:none}
body.sm-collapsed .sm-group-items{display:flex!important;padding:0;margin:0;border:none}
  /* ao abrir no hover, volta ao comportamento normal: so o grupo aberto mostra os itens */
  body.sm-collapsed .sm-side:hover .sm-group-items{display:none!important;flex-direction:column;gap:2px;padding:2px 0 4px 12px;margin-left:9px;border-left:1.5px solid #eef2f4}
  body.sm-collapsed .sm-side:hover .sm-group.open .sm-group-items{display:flex!important}
body.sm-collapsed .sm-group-head{justify-content:center;padding:9px 0}
@media(max-width:780px){ body:not(.sm-expanded) .sm-arrow{display:none} body:not(.sm-expanded) .sm-group-items{display:flex!important;padding:0;margin:0;border:none} body:not(.sm-expanded) .sm-group-head{justify-content:center;padding:9px 0} }
.SMGROUPCSS{}
body.sm-collapsed{padding-left:64px;}
body.sm-collapsed .sm-side{width:64px}
body.sm-collapsed .sm-logo-tx,body.sm-collapsed .sm-tx,body.sm-collapsed .sm-foot{display:none}
body.sm-collapsed .sm-top{justify-content:center;padding:12px 0}
body.sm-collapsed .sm-item{justify-content:center;padding:9px 0}
.bottom-bar{left:232px !important;}
body.sm-collapsed .bottom-bar{left:64px !important;}
@media (max-width:780px){
  body{padding-left:64px !important;}
  .sm-side{width:64px}
  .sm-logo-tx,.sm-tx,.sm-foot{display:none}
  .sm-top{justify-content:center;padding:12px 0}
  .sm-item{justify-content:center;padding:9px 0}
  body.sm-expanded .sm-side{width:228px;box-shadow:6px 0 24px rgba(0,0,0,.18)}
  body.sm-expanded .sm-logo-tx,body.sm-expanded .sm-tx,body.sm-expanded .sm-foot{display:block}
  body.sm-expanded .sm-tx{display:inline}
  body.sm-expanded .sm-top{justify-content:flex-start;padding:12px 14px}
  body.sm-expanded .sm-item{justify-content:flex-start;padding:9px 11px}
  .bottom-bar,body.sm-collapsed .bottom-bar{left:64px !important;}
}
</style>

<style>
/* barra lateral: abre ao passar o mouse (hover), sobrepondo o conteudo */
body.sm-collapsed .sm-side{overflow:hidden}
body.sm-collapsed .sm-side:hover{width:232px;box-shadow:6px 0 24px rgba(0,0,0,.18);z-index:120}
body.sm-collapsed .sm-side:hover .sm-logo-tx,
body.sm-collapsed .sm-side:hover .sm-foot{display:block}
body.sm-collapsed .sm-side:hover .sm-tx{display:inline;flex:1}
body.sm-collapsed .sm-side:hover .sm-arrow{display:block}
body.sm-collapsed .sm-side:hover .sm-top{justify-content:flex-start;padding:12px 14px}
body.sm-collapsed .sm-side:hover .sm-item{justify-content:flex-start;padding:9px 11px}
body.sm-collapsed .sm-side:hover .sm-group-head{justify-content:flex-start;padding:9px 11px}
</style>

<script>
/* =====================================================================

   ---------------------------------------------------------------------
   Fonte: "Consulta de serviços" exportada do GPM (CSV com ; ou XLSX).
   - Cada importação vai para o turno_data, uma linha por mês
     (ocorr_gpm_AAAA-MM), mesclando pelo nº do Serviço: importar de novo
     o mesmo período só atualiza (situação e retorno podem mudar).
   - A base sai do sufixo da equipe (-FSA, -SRR, -JAC, -IRC…), igual ao Turno.
   - Atendida = Situação "Concluído" + Retorno de campo "EXECUTADO".
   - Faturado = atendidas × valor por ocorrência do tipo de equipe
     (o GPM não traz valor; ele fica salvo em ocorr_valores e só gestor altera).
   ===================================================================== */
var SUPA_URL='https://eqxejfoibebcbtsqymji.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxeGVqZm9pYmViY2J0c3F5bWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NjUzMTEsImV4cCI6MjA4NzQ0MTMxMX0.lwf7_EJ6UchEOpzhW3cVKztxDGy78gaQblRvgiEwWh8';

function finMoney(n){ return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
var OC_MESES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fgCurto(ym){ var p=String(ym).split('-'); return OC_MESES_ABR[+p[1]-1]+'/'+p[0].slice(2); }
function fgPct(n){ return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
var FG_ICO={
  filtro:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4Z"/></svg>',

// ---------- utilidades ----------
function ocSemAcento(s){ return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').toUpperCase().trim(); }
function ocPad(n){ n=String(n); return n.length<2?'0'+n:n; }
function ocBaseDe(eq){ var m=String(eq||'').toUpperCase().trim().match(/-([A-Z]{2,3})$/); var k=m?m[1].toLowerCase():''; return (k&&k!=='sb'&&OC_BASES[k])?k:'sb'; }
// "OC. 31461" / "0C-33184" / "oc 99153" -> "OC-31461". Código vazio ou inválido: usa o nº do serviço para não juntar coisas diferentes
function ocNormOC(raw, serv){
  var t=String(raw||'').toUpperCase().replace(/\s+/g,'');
  var m=t.match(/^[O0]C\W*(\d+)$/);
  if(m) return 'OC-'+m[1].replace(/^0+(?=\d)/,'');
  if(/\d{3,}/.test(t)) return t;
  return '#'+serv;
}
function ocDataISO(v){
  var s=String(v||'').trim(), m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ var y=m[3].length===2?'20'+m[3]:m[3]; return y+'-'+ocPad(m[2])+'-'+ocPad(m[1]); }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?m[1]+'-'+m[2]+'-'+m[3]:'';
}
function ocDataBR(iso){ return iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):''; }
function ocStatus(sit, ret){
  var s=ocSemAcento(sit), r=ocSemAcento(ret);
  if(s.indexOf('CANCEL')>=0) return 'canc';
  if(s.indexOf('CONCLU')===0||s.indexOf('FINALIZ')===0||s.indexOf('ENCERR')===0) return r.indexOf('EXECUTADO')===0?'exec':'nexe';
  return 'aber';
}
var OC_ST_NOME={exec:'Executada', nexe:'Não executada', canc:'Cancelada', aber:'Em aberto'};
function ocNum(n){ return Number(n||0).toLocaleString('pt-BR'); }
function ocMoneyCurto(v){
  v=Number(v||0);
  if(v>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
  if(v>=1e4) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';
  return finMoney(v);
}
function ocAttr(s){ return finEsc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function ocMsg(t, tipo){ var m=$('oc-msg'); if(!m) return; m.textContent=t||''; m.className='oc-msg'+(tipo?' '+tipo:''); clearTimeout(m._t); if(t&&tipo==='ok') m._t=setTimeout(function(){ m.textContent=''; },7000); }
function ocValor(tk){ var t=(OC_VAL&&OC_VAL.tipos)||{}; return Object.prototype.hasOwnProperty.call(t,tk)&&t[tk]!==''&&t[tk]!=null?Number(t[tk]):null; }
function ocTipoNome(tk){ return OC_TIPO_NOME[tk]||tk; }
function ocTemValores(){ var t=(OC_VAL&&OC_VAL.tipos)||{}; return Object.keys(t).some(function(k){ return Number(t[k])>0; }); }

// ---------- banco (turno_data) ----------
async function ocCarregar(){
  var r=await fetch(SUPA_URL+'/rest/v1/turno_data?select=key,value&key=like.ocorr*',{headers:SUPA_H,cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  var dados=await r.json();
  var db={}, val={tipos:{}};
  (dados||[]).forEach(function(row){
    if(!row||!row.value) return;
    if(row.key==='ocorr_valores'){ val=row.value; if(!val.tipos) val.tipos={}; return; }
    if(row.key.indexOf('ocorr_gpm_')===0){ var c=row.value.comp||row.key.slice(10); db[c]=row.value; }
  });
  OC_DB=db; OC_VAL=val;
}
async function ocGravar(regs){
  var agora=new Date().toISOString();
  var body=regs.map(function(r){ return {key:r.key, value:r.value, updated_at:agora}; });
  setDbStatus('syncing','Salvando…');
  var w=await fetch(SUPA_URL+'/rest/v1/turno_data?on_conflict=key',{method:'POST',
    headers:Object.assign({Prefer:'resolution=merge-duplicates,return=minimal'},SUPA_H),
    body:JSON.stringify(body)});
  if(!w.ok){ setDbStatus('offline','Não salvou'); throw new Error('HTTP '+w.status); }
  setDbStatus('online','Compartilhado');
}
async function ocUsuario(){ var u=window.MARIUA_USER; return (u&&u.email)||''; }

// ---------- entrada da tela ----------
async function ocIniciar(recarregar){
  if(!OC_DB||recarregar){
    var st=$('oc-status'); if(st&&!OC_DB) st.textContent='Carregando do banco…';
    setDbStatus('syncing','Carregando…');
    try{ await ocCarregar(); setDbStatus('online','Compartilhado'); }
    catch(e){ OC_DB=OC_DB||{}; OC_VAL=OC_VAL||{tipos:{}}; setDbStatus('offline','Sem conexão'); ocMsg('Não foi possível carregar as ocorrências ('+(e.message||e)+').','err'); }
  }
  ocRender();
  if(!OC_VAL_AUTO && ocTodas().length && !ocTemValores()){ OC_VAL_AUTO=true; ocToggleValores(true); }
}

// todas as linhas, normalizadas e em ordem de data (a 1ª visita é a que conta)
function ocTodas(){
  var out=[], id=0;
  Object.keys(OC_DB||{}).sort().forEach(function(c){
    ((OC_DB[c]&&OC_DB[c].rows)||[]).forEach(function(r){
      var eq=String(r.eq||'').toUpperCase().trim()||'(SEM EQUIPE)', tk=ocSemAcento(r.tp)||'SEM TIPO';
      if(!OC_TIPO_NOME[tk]&&r.tp) OC_TIPO_NOME[tk]=String(r.tp).replace(/\s+/g,' ').trim().toUpperCase();
      out.push({id:id++, s:String(r.s), ot:r.ot||'', oc:ocNormOC(r.ot,r.s), d:r.d||'', eq:eq, base:ocBaseDe(eq),
        tk:tk, sit:r.sit||'', ret:r.ret||'', st:ocStatus(r.sit,r.ret), sup:r.sup||'', end:r.end||''});
    });
  });
  out.sort(function(a,b){ return a.d<b.d?-1:a.d>b.d?1:(Number(a.s)||0)-(Number(b.s)||0); });
  return out;
}
function ocPassa(r, sem){
  if(OC_F.mes && sem!=='mes' && r.d.slice(0,7)!==OC_F.mes) return false;
  if(OC_F.base && sem!=='base' && r.base!==OC_F.base) return false;
  if(OC_F.tipo && r.tk!==OC_F.tipo) return false;
  return true;
}

// ---------- agregação ----------
function ocAgregar(rows){
  var porOC=OC_F.modo==='oc', eqs={}, bases={}, porMes={}, distintas={}, contadas={};
  var T={exec:0,nexe:0,canc:0,aber:0,valor:0,semValor:{}};
  rows.forEach(function(r){
    var e=eqs[r.eq]||(eqs[r.eq]={eq:r.eq, base:r.base, tipos:{}, sups:{}, exec:0, nexe:0, canc:0, aber:0, valor:0, semValor:0, vistos:{exec:{},nexe:{},canc:{},aber:{}}, rows:[]});
    e.rows.push(r);
    e.tipos[r.tk]=(e.tipos[r.tk]||0)+1;
    if(r.sup) e.sups[r.sup]=(e.sups[r.sup]||0)+1;
    var chave=porOC?r.oc:r.s;
    if(e.vistos[r.st][chave]) return;            // mesma ocorrência de novo para a mesma equipe
    e.vistos[r.st][chave]=1; contadas[r.id]=1;
    e[r.st]++; T[r.st]++;
    if(r.st!=='exec') return;
    distintas[r.oc]=1;
    var v=ocValor(r.tk);
    if(v==null){ e.semValor++; T.semValor[r.tk]=(T.semValor[r.tk]||0)+1; v=0; }
    e.valor+=v; T.valor+=v;
    var m=r.d.slice(0,7), pm=porMes[m]||(porMes[m]={tot:{n:0,v:0}});
    var pb=pm[r.base]||(pm[r.base]={n:0,v:0}); pb.n++; pb.v+=v; pm.tot.n++; pm.tot.v+=v;
  });
  Object.keys(eqs).forEach(function(k){
    var e=eqs[k], b=bases[e.base]||(bases[e.base]={base:e.base, exec:0, nexe:0, canc:0, aber:0, valor:0, eqs:[]});
    b.exec+=e.exec; b.nexe+=e.nexe; b.canc+=e.canc; b.aber+=e.aber; b.valor+=e.valor; b.eqs.push(e);
    e.tipoPrinc=Object.keys(e.tipos).sort(function(a,b){ return e.tipos[b]-e.tipos[a]; })[0]||'';
    e.misto=Object.keys(e.tipos).length>1;
    e.sup=Object.keys(e.sups).sort(function(a,b){ return e.sups[b]-e.sups[a]; })[0]||'';
  });
  var lb=Object.keys(bases).map(function(k){ return bases[k]; });
  lb.forEach(function(b){ b.eqs.sort(function(x,y){ return (y.exec-x.exec)||(y.valor-x.valor)||(x.eq<y.eq?-1:1); }); b.ativas=b.eqs.filter(function(e){ return e.exec>0; }).length; });
  lb.sort(function(x,y){ return (y.exec-x.exec)||(y.valor-x.valor); });
  var meses=rows.map(function(r){ return r.d.slice(0,7); }).filter(Boolean);
  meses=Array.from(new Set(meses)).sort();
  return {rows:rows, eqs:eqs, bases:lb, porMes:porMes, distintas:Object.keys(distintas).length, contadas:contadas, T:T, meses:meses};
}

// ---------- desenho ----------
function ocRender(){
  var todas=ocTodas();
  ocStatusLinha(todas);
  OC_LISTA_TIPOS=Array.from(new Set(todas.map(function(r){ return r.tk; }))).sort();
  if(OC_F.tipo && OC_LISTA_TIPOS.indexOf(OC_F.tipo)<0) OC_F.tipo='';
  ocFiltros(todas);
  if(!todas.length){
    OC_ULT=null;
    $('oc-kpis').innerHTML='<div class="fg-kpi" style="grid-column:1/-1;justify-content:center"><span class="fg-vazio" style="padding:10px">Nenhuma consulta importada ainda. No GPM, exporte a <b>Consulta de serviços</b> e use <b>Importar consulta GPM</b> aqui em cima.</span></div>';
    $('oc-bases').innerHTML=''; $('oc-tabela').innerHTML='<div class="fg-vazio">As equipes aparecem aqui depois da primeira importação.</div>';
    $('oc-evo').innerHTML=''; $('oc-tbl-cap').textContent='';
    return;
  }
  var A=ocAgregar(todas.filter(function(r){ return ocPassa(r); }));
  var B=ocAgregar(todas.filter(function(r){ return ocPassa(r,'base'); }));
  var C=ocAgregar(todas.filter(function(r){ return ocPassa(r,'mes'); }));
  OC_ULT=A;
  ocKpis(A); ocBasesCards(B); ocTabela(A); ocEvolucao(C);
}

function ocStatusLinha(todas){
  var st=$('oc-status'); if(!st) return;
  if(!todas.length){ st.innerHTML='Nenhuma consulta do GPM importada.'; return; }
  var ult=null;
  Object.keys(OC_DB).forEach(function(c){ var v=OC_DB[c]; if(v&&v.atualizado&&(!ult||v.atualizado>ult.atualizado)) ult=v; });
  var d0=todas[0].d, d1=todas[todas.length-1].d;
  var h='<b>'+ocNum(todas.length)+' serviços</b> na base, de '+ocDataBR(d0)+' a '+ocDataBR(d1)+'.';
  if(ult){
    var dt=new Date(ult.atualizado);
    h+=' Última importação em '+dt.toLocaleDateString('pt-BR')+' às '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
      +(ult.arquivo?' ('+finEsc(ult.arquivo)+')':'')+'.';
  }
  st.innerHTML=h;
}

function ocFiltros(todas){
  var box=$('oc-side'); if(!box) return;
  var meses=Array.from(new Set(todas.map(function(r){ return r.d.slice(0,7); }).filter(Boolean))).sort();
  if(OC_F.mes && meses.indexOf(OC_F.mes)<0) OC_F.mes='';
  var bs=Array.from(new Set(todas.map(function(r){ return r.base; })));
  bs.sort(function(a,b){ return Object.keys(OC_BASES).indexOf(a)-Object.keys(OC_BASES).indexOf(b); });
  if(OC_F.base && bs.indexOf(OC_F.base)<0) OC_F.base='';
  var chip=function(on,label,acao,extra,titulo){
    return '<button type="button" class="fg-chip'+(on?' on':'')+'" aria-pressed="'+on+'" onclick="'+acao+'"'+(titulo?' title="'+ocAttr(titulo)+'"':'')+'>'+(extra||'')+label+'</button>';
  };
  var bloco=function(tit,chave,conteudo,semLimpar){
    return '<div class="fg-fbloco"><div class="fg-fh"><span>'+tit+'</span>'
      +(semLimpar?'':'<button type="button" class="fg-fclr" title="Limpar filtro" aria-label="Limpar filtro de '+tit.toLowerCase()+'" onclick="ocFiltro(\''+chave+'\',\'\')"'+(OC_F[chave]?'':' disabled')+'>'+FG_ICO.filtro+'</button>')
      +'</div>'+conteudo+'</div>';
  };
  var hMes=meses.map(function(m){ return chip(OC_F.mes===m, fgCurto(m), "ocFiltro('mes','"+m+"')"); }).join('');
  var hBase=chip(!OC_F.base,'Todas',"ocFiltro('base','')")
    +bs.map(function(b){ return chip(OC_F.base===b, finEsc(OC_BASES[b].nome), "ocFiltro('base','"+b+"')", '<i style="background:'+OC_BASES[b].cor+'"></i>'); }).join('');
  var hTipo=chip(!OC_F.tipo,'Todos',"ocFiltro('tipo','')")
    +OC_LISTA_TIPOS.map(function(t,i){ return chip(OC_F.tipo===t, finEsc(ocTipoNome(t)), 'ocFiltroTipo('+i+')'); }).join('');
  var hModo=chip(OC_F.modo==='oc','Ocorrência',"ocModo('oc')",'','Cada OC conta uma vez por equipe, mesmo que ela tenha voltado ao local')
    +chip(OC_F.modo==='serv','Serviço',"ocModo('serv')",'','Cada serviço (despacho) do GPM conta separado');
  box.innerHTML=bloco('Mês','mes','<div class="fg-fgrid">'+hMes+'</div>')
    +bloco('Base','base','<div class="fg-flist">'+hBase+'</div>')
    +bloco('Tipo de equipe','tipo','<div class="fg-flist">'+hTipo+'</div>')
    +bloco('Contar por','modo','<div class="fg-flist">'+hModo+'</div>',true);
}
// clicar no filtro já ativo desliga ele
function ocFiltro(chave,valor){ OC_F[chave]=(OC_F[chave]===valor?'':valor); ocRender(); }
function ocFiltroTipo(i){ var t=OC_LISTA_TIPOS[i]||''; OC_F.tipo=(OC_F.tipo===t?'':t); ocRender(); }
function ocModo(m){ OC_F.modo=m; ocRender(); }

function ocPeriodo(A){
  var n=A.meses.length;
  if(!n) return '';
  return n===1?fgCurto(A.meses[0]):fgCurto(A.meses[0])+' a '+fgCurto(A.meses[n-1]);
}
function ocAvisoValores(T){
  var faltam=Object.keys(T.semValor);
  if(!faltam.length) return '';
  return 'sem valor para '+faltam.map(function(t){ return finEsc(ocTipoNome(t)); }).join(', ');
}

function ocKpis(A){
  var box=$('oc-kpis'); if(!box) return;
  var T=A.T, porOC=OC_F.modo==='oc';
  if(!A.rows.length){ box.innerHTML='<div class="fg-kpi" style="grid-column:1/-1;justify-content:center"><span class="fg-vazio" style="padding:8px">Nenhum serviço para os filtros escolhidos</span></div>'; return; }
  var card=function(ico,lbl,val,sub){
    return '<div class="fg-kpi"><span class="fg-ico">'+ico+'</span><span class="fg-kt"><span class="fg-kl">'+lbl+'</span><span class="fg-kv">'+val+'</span>'+(sub?'<span class="fg-ks">'+sub+'</span>':'')+'</span></div>';
  };
  var sub1=porOC
    ? (A.distintas!==T.exec ? ocNum(A.distintas)+' OCs distintas; '+ocNum(T.exec-A.distintas)+' com mais de uma equipe' : ocNum(A.distintas)+' OCs distintas')
    : 'serviços executados';
  var falta=ocAvisoValores(T);
  var sub2=falta ? '<span class="up">'+falta+'</span>'
    : (T.exec ? 'média de '+finMoney(T.valor/T.exec)+' por ocorrência' : '');
  var ativas=A.bases.reduce(function(s,b){ return s+b.ativas; },0);
  var nb=A.bases.filter(function(b){ return b.ativas>0; }).length;
  var perdas=T.nexe+T.canc;
  var desp=T.exec+T.nexe+T.canc+T.aber;
  var pl=function(n,um,varios){ return ocNum(n)+' '+(n===1?um:varios); };
  var sub4=pl(T.nexe,'não executada','não executadas')+', '+pl(T.canc,'cancelada','canceladas')+(T.aber?', '+ocNum(T.aber)+' em aberto':'');
  box.innerHTML=card(OC_ICO.ok,'Ocorrências atendidas'+(ocPeriodo(A)?' em '+ocPeriodo(A):''),ocNum(T.exec),sub1)
    +card(FG_ICO.recibo,'Faturado',finMoney(T.valor),sub2)
    +card(OC_ICO.eq,'Equipes que atenderam',ocNum(ativas),nb+(nb===1?' base':' bases'))
    +card(OC_ICO.alerta,'Não executadas e canceladas',ocNum(perdas)+(desp?' <small style="font-size:.72rem;font-weight:700;color:#5b6b7a">'+fgPct(perdas/desp*100)+'</small>':''),sub4);
}

function ocBasesCards(B){
  var box=$('oc-bases'); if(!box) return;
  var tot=B.T.exec||0;
  box.innerHTML=B.bases.map(function(b){
    var cfg=OC_BASES[b.base], on=OC_F.base===b.base, off=OC_F.base&&!on;
    var pct=tot?b.exec/tot*100:0;
    return '<button type="button" class="oc-base'+(on?' on':'')+(off?' off':'')+'" style="--c:'+cfg.cor+'" aria-pressed="'+on+'" onclick="ocFiltro(\'base\',\''+b.base+'\')" title="Filtrar por '+ocAttr(cfg.nome)+'">'
      +'<span class="nm">'+finEsc(cfg.nome)+'</span>'
      +'<span class="q">'+ocNum(b.exec)+'<small>atendidas</small></span>'
      +'<span class="v">'+finMoney(b.valor)+'</span>'
      +'<span class="s">'+b.ativas+(b.ativas===1?' equipe atendeu':' equipes atenderam')+', '+fgPct(pct)+' do total</span>'
      +'</button>';
  }).join('');
}

function ocTabela(A){
  var box=$('oc-tabela'), cap=$('oc-tbl-cap'); if(!box) return;
  if(cap) cap.textContent=(ocPeriodo(A)?ocPeriodo(A)+', ':'')+(OC_F.modo==='oc'?'contando por ocorrência':'contando por serviço');
  if(!A.rows.length){ box.innerHTML='<div class="fg-vazio">Nenhum serviço para os filtros escolhidos</div>'; return; }
  OC_LISTA_EQ=[];
  var z=function(n){ return n?ocNum(n):'<span class="oc-zero">0</span>'; };
  var h='<table class="oc-tbl"><thead><tr><th>Equipe</th><th>Tipo</th><th class="n">Atendidas</th><th class="n">Não exec.</th><th class="n">Canceladas</th><th class="n">Valor unit.</th><th class="n">Faturado</th><th>Participação na base</th></tr></thead><tbody>';
  A.bases.forEach(function(b){
    var cfg=OC_BASES[b.base];
    h+='<tr class="oc-grp"><td colspan="2"><i style="background:'+cfg.cor+'"></i>'+finEsc(cfg.nome)+'<small>'+b.eqs.length+(b.eqs.length===1?' equipe':' equipes')+'</small></td>'
      +'<td class="n">'+ocNum(b.exec)+'</td><td class="n">'+z(b.nexe)+'</td><td class="n">'+z(b.canc)+'</td><td></td>'
      +'<td class="n">'+finMoney(b.valor)+'</td><td>'+(A.T.exec?fgPct(b.exec/A.T.exec*100)+' do total':'')+'</td></tr>';
    b.eqs.forEach(function(e){
      var i=OC_LISTA_EQ.push(e.eq)-1, aberto=!!OC_ABERTO[e.eq];
      var vu=ocValor(e.tipoPrinc);
      var vuTxt=e.misto?'<span title="Equipe com mais de um tipo">vários</span>':(vu==null?'<span class="oc-falta" title="Defina em Valor por ocorrência">sem valor</span>':finMoney(vu));
      var pct=b.exec?e.exec/b.exec*100:0;
      h+='<tr class="oc-eq"><td><button type="button" class="oc-eqbtn" aria-expanded="'+aberto+'" onclick="ocToggleEq('+i+')"><span class="ch">▸</span>'+finEsc(e.eq)+'</button>'
        +(e.sup?'<span class="oc-sup">'+finEsc(e.sup)+'</span>':'')+'</td>'
        +'<td>'+finEsc(ocTipoNome(e.tipoPrinc))+(e.misto?' +':'')+'</td>'
        +'<td class="n"><b>'+z(e.exec)+'</b></td><td class="n">'+z(e.nexe)+'</td><td class="n">'+z(e.canc)+'</td>'
        +'<td class="n">'+vuTxt+'</td><td class="n"><b>'+finMoney(e.valor)+'</b></td>'
        +'<td><span class="oc-share"><span><b style="width:'+pct.toFixed(1)+'%;background:'+cfg.cor+'"></b></span><em>'+fgPct(pct)+'</em></span></td></tr>';
      if(aberto) h+=ocDetalhe(e, A);
    });
  });
  var T=A.T;
  h+='</tbody><tfoot><tr><td colspan="2">Total</td><td class="n">'+ocNum(T.exec)+'</td><td class="n">'+ocNum(T.nexe)+'</td><td class="n">'+ocNum(T.canc)+'</td><td></td><td class="n">'+finMoney(T.valor)+'</td><td></td></tr></tfoot></table>';
  box.innerHTML=h;
}
function ocDetalhe(e, A){
  var linhas=e.rows.slice().sort(function(a,b){ return a.d<b.d?1:a.d>b.d?-1:0; });
  var h='<tr class="oc-det"><td colspan="8"><table><thead><tr><th>Data</th><th>Ocorrência</th><th>Serviço</th><th>Resultado</th><th>Endereço</th><th class="n">Valor</th></tr></thead><tbody>';
  linhas.forEach(function(r){
    var conta=!!A.contadas[r.id], val='—';
    if(r.st==='exec'){
      if(!conta) val='<span class="oc-rep" title="Esta equipe já tinha atendido esta OC; não conta de novo">repetida</span>';
      else { var v=ocValor(r.tk); val=v==null?'<span class="oc-falta">sem valor</span>':finMoney(v); }
    }
    h+='<tr><td>'+ocDataBR(r.d)+'</td><td title="'+ocAttr(r.ot)+'">'+finEsc(r.oc.charAt(0)==='#'?(r.ot||'(sem código)'):r.oc)+'</td><td>'+finEsc(r.s)+'</td>'
      +'<td><span class="oc-tag '+r.st+'">'+OC_ST_NOME[r.st]+'</span></td><td class="end">'+finEsc(r.end)+'</td><td class="n">'+val+'</td></tr>';
  });
  return h+'</tbody></table></td></tr>';
}
function ocToggleEq(i){ var k=OC_LISTA_EQ[i]; if(!k) return; OC_ABERTO[k]=!OC_ABERTO[k]; if(OC_ULT) ocTabela(OC_ULT); }

function ocEvolucao(C){
  var box=$('oc-evo'); if(!box) return;
  var meses=Object.keys(C.porMes).filter(Boolean).sort();
  if(!meses.length){ box.innerHTML='<div class="fg-vazio">Sem ocorrências atendidas para mostrar</div>'; return; }
  var max=Math.max.apply(null,meses.map(function(m){ return C.porMes[m].tot.n; }))||1, H=150;
  var ordem=Object.keys(OC_BASES), usadas={}, temValor=C.T.valor>0;
  var cols=meses.map(function(m){
    var pm=C.porMes[m], on=OC_F.mes===m;
    var segs=ordem.filter(function(b){ return pm[b]; }).map(function(b){
      usadas[b]=1;
      return '<div class="seg" style="height:'+Math.max(2,pm[b].n/max*H).toFixed(1)+'px;background:'+OC_BASES[b].cor+'" title="'+ocAttr(OC_BASES[b].nome)+': '+pm[b].n+' atendidas, '+ocAttr(finMoney(pm[b].v))+'"></div>';
    }).join('');
    return '<button type="button" class="fin-mes-col oc-col'+(OC_F.mes&&!on?' apag':'')+'" aria-pressed="'+on+'" onclick="ocFiltro(\'mes\',\''+m+'\')" aria-label="'+fgCurto(m)+': '+pm.tot.n+' atendidas">'
      +'<div class="fin-mes-tot"><span class="nm">'+ocNum(pm.tot.n)+'</span>'+(temValor?'<span class="rs">'+ocMoneyCurto(pm.tot.v)+'</span>':'')+'</div>'
      +'<div class="fin-mes-bar">'+segs+'</div><div class="fin-mes-lbl">'+fgCurto(m)+'</div></button>';
  }).join('');
  var leg=ordem.filter(function(b){ return usadas[b]; }).map(function(b){ return '<span class="fin-leg"><i style="background:'+OC_BASES[b].cor+'"></i>'+finEsc(OC_BASES[b].nome)+'</span>'; }).join('');
  box.innerHTML='<div class="fin-mes-chart">'+cols+'</div><div class="oc-evo-leg">'+leg+'</div>';
}

// ---------- valor por ocorrência ----------
function ocToggleValores(forcarAbrir){
  var p=$('oc-valores'), b=$('oc-btn-val'); if(!p) return;
  var abrir=forcarAbrir===true?true:p.style.display==='none';
  p.style.display=abrir?'':'none';
  if(b) b.setAttribute('aria-expanded',abrir);
  if(abrir) ocValoresForm();
}
function ocValoresForm(){
  var p=$('oc-valores'); if(!p) return;
  var todas=ocTodas(), cont={};
  todas.forEach(function(r){ cont[r.tk]=(cont[r.tk]||0)+1; });
  var tipos=Object.keys(cont);
  Object.keys((OC_VAL&&OC_VAL.tipos)||{}).forEach(function(t){ if(tipos.indexOf(t)<0) tipos.push(t); });
  tipos.sort(function(a,b){ return (cont[b]||0)-(cont[a]||0)||(a<b?-1:1); });
  OC_TIPOS_FORM=tipos;
  var h='<div class="oc-valbox"><h2 class="fg-h">Valor por ocorrência atendida</h2>'
    +'<p>O faturado de cada equipe é o número de ocorrências atendidas multiplicado pelo valor do tipo dela. O mesmo valor vale para todas as bases e todos os meses. Para um tipo que não é faturado, preencha 0.</p>';
  var pode=ocPodeEditarValores();
  if(!ocTemValores()) h+='<div class="oc-aviso">Nenhum valor definido ainda: o faturado aparece como R$ 0,00 '+(pode?'até você preencher e salvar.':'até um gestor preencher os valores.')+'</div>';
  if(!tipos.length) h+='<p style="margin-top:10px">Importe uma consulta do GPM para listar os tipos de equipe.</p>';
  else {
    h+='<div class="oc-val">'+tipos.map(function(t,i){
      var v=ocValor(t);
      return '<label for="oc-v-'+i+'">'+finEsc(ocTipoNome(t))+'<small>'+(cont[t]?ocNum(cont[t])+(cont[t]===1?' serviço importado':' serviços importados'):'sem serviços importados')+'</small>'
        +'<span class="inp"><span>R$</span><input id="oc-v-'+i+'" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00" value="'+(v==null?'':v)+'"'+(pode?'':' disabled')+'></span></label>';
    }).join('')+'</div>';
    var info='';
    if(OC_VAL&&OC_VAL.atualizado){ var dt=new Date(OC_VAL.atualizado); info='Alterado em '+dt.toLocaleDateString('pt-BR')+(OC_VAL.por?' por '+finEsc(OC_VAL.por):''); }
    h+='<div class="oc-valact"><span class="fg-ks">'+info+'</span>'
      +(pode?'<button class="btn add" type="button" id="oc-val-go" onclick="ocSalvarValores()">Salvar valores</button>':'<span class="fg-ks">Só gestor altera os valores.</span>')+'</div>';
  }
  p.innerHTML=h+'</div>';
}
async function ocSalvarValores(){
  if(!ocPodeEditarValores()){ ocMsg('Só gestor altera os valores por ocorrência.','err'); return; }
  var tipos={}, ruim=[];
  OC_TIPOS_FORM.forEach(function(t,i){
    var el=$('oc-v-'+i), v=el?String(el.value).trim():'';
    if(v==='') return;
    var n=Number(v.replace(',','.'));
    if(!isFinite(n)||n<0){ ruim.push(t); return; }
    tipos[t]=Math.round(n*100)/100;
  });
  if(ruim.length){ ocMsg('Valor inválido para '+ruim.join(', ')+'.','err'); return; }
  var btn=$('oc-val-go'); if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  var val={tipos:tipos, atualizado:new Date().toISOString(), por:await ocUsuario()};
  try{
    await ocGravar([{key:'ocorr_valores', value:val}]);
    OC_VAL=val; ocMsg('Valores salvos. O faturado já foi recalculado.','ok');
    ocRender(); ocValoresForm();
  }catch(e){
    ocMsg('Não foi possível salvar os valores: '+(e.message||e),'err');
    if(btn){ btn.disabled=false; btn.textContent='Salvar valores'; }
  }
}

// ---------- importação da consulta do GPM ----------
var OC_COLS={
  s:['SERVICO','N SERVICO','NUMERO SERVICO'], ot:['SS/OT','SS / OT','OT','SS','OCORRENCIA'], sit:['SITUACAO','STATUS'],
  ret:['RETORNO DE CAMPO','RETORNO CAMPO'], d:['DATA SERVICO','DATA DO SERVICO','DATA'], eq:['EQUIPE'],
  tp:['TIPO DE EQUIPE','TIPO EQUIPE'], sup:['SUPERVISOR'], end:['ENDERECOS','ENDERECO']
};
function ocParseCSV(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  var l0=text.split(/\r?\n/,1)[0]||'';
  var sep=l0.split(';').length>=l0.split(',').length?';':(l0.indexOf('\t')>=0?'\t':',');
  var rows=[], cur=[], f='', q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; continue; }
    if(c==='"'){ q=true; continue; }
    if(c===sep){ cur.push(f); f=''; continue; }
    if(c==='\r') continue;
    if(c==='\n'){ cur.push(f); rows.push(cur); cur=[]; f=''; continue; }
    f+=c;
  }
  if(f!==''||cur.length){ cur.push(f); rows.push(cur); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
}
function ocLerArquivo(file){
  return new Promise(function(res,rej){
    var nome=(file.name||'').toLowerCase();
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('não foi possível ler o arquivo')); };
    if(/\.xlsx?$/.test(nome)){
      if(typeof XLSX==='undefined'){ rej(new Error('leitor de Excel não carregou; exporte em CSV')); return; }
      fr.onload=function(){
        try{
          var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
          var ws=wb.Sheets[wb.SheetNames[0]];
          res(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'dd/mm/yyyy',defval:''}));
        }catch(e){ rej(e); }
      };
      fr.readAsArrayBuffer(file);
      return;
    }
    fr.onload=function(){
      var t=fr.result;
      if(t.indexOf('\uFFFD')>=0){   // não era UTF-8: relê como Windows-1252
        var f2=new FileReader(); f2.onload=function(){ res(ocParseCSV(f2.result)); }; f2.onerror=fr.onerror;
        f2.readAsText(file,'windows-1252'); return;
      }
      res(ocParseCSV(t));
    };
    fr.readAsText(file,'utf-8');
  });
}
async function ocImportar(file){
  if(!file) return;
  ocMsg('Lendo '+file.name+'…','');
  var linhas;
  try{ linhas=await ocLerArquivo(file); }
  catch(e){ ocMsg('Não foi possível ler o arquivo: '+(e.message||e),'err'); return; }
  if(!linhas||linhas.length<2){ ocMsg('O arquivo está vazio.','err'); return; }
  // acha a linha de cabeçalho (às vezes o GPM põe título antes)
  var hi=-1, idx={};
  for(var k=0;k<Math.min(linhas.length,10)&&hi<0;k++){
    var cab=linhas[k].map(ocSemAcento), achou={};
    Object.keys(OC_COLS).forEach(function(c){ var p=-1; OC_COLS[c].some(function(n){ p=cab.indexOf(n); return p>=0; }); achou[c]=p; });
    if(achou.s>=0&&achou.eq>=0&&achou.d>=0&&achou.sit>=0){ hi=k; idx=achou; }
  }
  if(hi<0){ ocMsg('Não reconheci o arquivo. Use a Consulta de serviços do GPM (precisa das colunas Serviço, Situação, Data Serviço e Equipe).','err'); return; }
  var g=function(l,c){ return idx[c]>=0?String(l[idx[c]]==null?'':l[idx[c]]).trim():''; };
  var porComp={}, semData=0, total=0;
  for(var i=hi+1;i<linhas.length;i++){
    var l=linhas[i], s=g(l,'s'), eq=g(l,'eq');
    if(!s) continue;
    var d=ocDataISO(g(l,'d'));
    if(!d){ semData++; continue; }
    var r={s:s, ot:g(l,'ot'), sit:g(l,'sit'), ret:g(l,'ret'), d:d, eq:eq.toUpperCase(), tp:g(l,'tp'), sup:g(l,'sup'), end:g(l,'end')};
    (porComp[d.slice(0,7)]=porComp[d.slice(0,7)]||[]).push(r); total++;
  }
  if(!total){ ocMsg('Nenhum serviço com data válida no arquivo.','err'); return; }
  if(!OC_DB){ try{ await ocCarregar(); }catch(e){ OC_DB={}; OC_VAL=OC_VAL||{tipos:{}}; } }
  var agora=new Date().toISOString(), regs=[], novos=0, atual=0, novoDB={};
  Object.keys(porComp).sort().forEach(function(c){
    var mapa={};
    ((OC_DB[c]&&OC_DB[c].rows)||[]).forEach(function(r){ mapa[r.s]=r; });
    porComp[c].forEach(function(r){ if(mapa[r.s]) atual++; else novos++; mapa[r.s]=r; });
    var rows=Object.keys(mapa).map(function(s){ return mapa[s]; });
    var val={comp:c, rows:rows, atualizado:agora, arquivo:file.name};
    novoDB[c]=val; regs.push({key:'ocorr_gpm_'+c, value:val});
  });
  ocMsg('Gravando '+ocNum(total)+' serviços…','');
  try{ await ocGravar(regs); }
  catch(e){ ocMsg('Não foi possível gravar no banco: '+(e.message||e),'err'); return; }
  Object.keys(novoDB).forEach(function(c){ OC_DB[c]=novoDB[c]; });
  var meses=Object.keys(porComp).sort().map(fgCurto);
  ocMsg(ocNum(total)+' serviços importados ('+meses.join(', ')+'): '+ocNum(novos)+' novos e '+ocNum(atual)+' atualizados'+(semData?'; '+semData+' linhas sem data ficaram de fora':'')+'.','ok');
  ocRender();
  var p=$('oc-valores');
  if(p&&p.style.display!=='none') ocValoresForm();
  else if(!ocTemValores()){ OC_VAL_AUTO=true; ocToggleValores(true); }
}

// ---------- resumo em CSV ----------
function ocExportar(){
  var A=OC_ULT;
  if(!A||!A.rows.length){ ocMsg('Não há dados para baixar com os filtros escolhidos.','err'); return; }
  var dec=function(n){ return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false}); };
  var L=[['Base','Equipe','Tipo de equipe','Supervisor','Atendidas','Não executadas','Canceladas','Valor unitário (R$)','Faturado (R$)']];
  A.bases.forEach(function(b){
    var nome=OC_BASES[b.base].nome;
    b.eqs.forEach(function(e){ var vu=ocValor(e.tipoPrinc); L.push([nome,e.eq,ocTipoNome(e.tipoPrinc)+(e.misto?' (+)':''),e.sup,e.exec,e.nexe,e.canc,(e.misto||vu==null)?'':dec(vu),dec(e.valor)]); });
    L.push(['Subtotal '+nome,'','','',b.exec,b.nexe,b.canc,'',dec(b.valor)]);
  });
  L.push(['TOTAL','','','',A.T.exec,A.T.nexe,A.T.canc,'',dec(A.T.valor)]);
  L.push([]);
  L.push(['Filtros: mês '+(OC_F.mes?fgCurto(OC_F.mes):'todos')+'; base '+(OC_F.base?OC_BASES[OC_F.base].nome:'todas')+'; tipo '+(OC_F.tipo?ocTipoNome(OC_F.tipo):'todos')+'; contagem por '+(OC_F.modo==='oc'?'ocorrência':'serviço')]);
  var csv='\uFEFF'+L.map(function(r){ return r.map(function(c){ c=String(c==null?'':c); return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';'); }).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='ocorrencias_por_equipe_'+(OC_F.mes||'todos')+(OC_F.base?'_'+OC_F.base:'')+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
}
